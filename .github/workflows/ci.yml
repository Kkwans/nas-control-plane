name: NCP CI

on:
  push:
    branches: [main, dot/ncp-modernization]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要重试或补发的现有版本 tag（留空则不执行 release job）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        # Host PTY integration tests exercise the root Agent boundary (/root).
        # Keep sudo-owned caches away from the runner user's Go caches so the
        # following vet/build steps can read and update their own cache.
        env:
          NCP_ROOT_GOCACHE: ${{ runner.temp }}/go-build-root
          NCP_ROOT_GOMODCACHE: ${{ runner.temp }}/go-mod-root
        run: |
          sudo -n env \
            GOCACHE="$NCP_ROOT_GOCACHE" \
            GOMODCACHE="$NCP_ROOT_GOMODCACHE" \
            "$(command -v go)" test ./...
      - name: Vet
        run: go vet ./...
      - name: Build native commands
        run: go build -buildvcs=false ./cmd/ncp-server ./cmd/ncp-agent
      - name: Build ARM64 binaries
        env:
          NCP_VERSION: ${{ github.workspace }}/VERSION
        run: |
          version="$(tr -d '\r\n' < "$NCP_VERSION")"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags "-X github.com/Kkwans/nas-control-plane/internal/agentsocket.BuildVersion=${version}" \
            -o "${RUNNER_TEMP}/ncp-server-linux-arm64" ./cmd/ncp-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags "-X github.com/Kkwans/nas-control-plane/internal/agentsocket.BuildVersion=${version}" \
            -o "${RUNNER_TEMP}/ncp-agent-linux-arm64" ./cmd/ncp-agent
      - name: Check release consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash scripts/release/check-version.sh \
            --tag "${GITHUB_REF_NAME}" \
            --server-binary "${RUNNER_TEMP}/ncp-server-linux-arm64" \
            --agent-binary "${RUNNER_TEMP}/ncp-agent-linux-arm64"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm run lint
      - name: Format check
        run: corepack pnpm run format:check
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Unit tests
        run: corepack pnpm test
      - name: Web artifact regression
        run: node --test scripts/verify-web-assets.test.mjs
      - name: Production build
        run: corepack pnpm run build
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Mock E2E and screenshot regression
        env:
          NCP_CAPTURE_UI: '1'
        run: corepack pnpm exec playwright test
      - name: Test UI artifact partitioning
        if: ${{ always() }}
        run: python3 -m unittest discover -s ../scripts/ci -p 'test_*.py'
      - name: Prepare bounded fixture UI artifacts
        id: prepare-ui-artifacts
        if: ${{ always() }}
        run: |
          python3 ../scripts/ci/partition_ui_artifacts.py \
            --source test-results \
            --destination "${RUNNER_TEMP}/ncp-ui-artifacts" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload fixture UI screenshots part 1
        if: ${{ always() && steps.prepare-ui-artifacts.outcome == 'success' && fromJSON(steps.prepare-ui-artifacts.outputs.parts) >= 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ncp-fixture-ui-${{ github.sha }}-${{ github.run_attempt }}-part-1
          # 分片目录仅含白名单 PNG 与捕获坐标 JSON，保留 test-results 相对路径。
          path: ${{ runner.temp }}/ncp-ui-artifacts/part-1/
          if-no-files-found: error
          retention-days: 14
      - name: Upload fixture UI screenshots part 2
        if: ${{ always() && steps.prepare-ui-artifacts.outcome == 'success' && fromJSON(steps.prepare-ui-artifacts.outputs.parts) >= 2 }}
