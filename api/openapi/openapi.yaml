openapi: 3.1.1
info:
  title: NAS Control Plane API
  version: 0.1.0
  description: Phase 0 的 API 契约。能力信息只能由 ncp-agent 的受控接口提供。
paths:
  /healthz:
    get:
      operationId: getServerHealth
      summary: 获取 NCP Server 健康状态
      tags: [system]
      responses:
        '200':
          description: Server 可响应 HTTP 请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getServerReadiness
      summary: 检查 Agent、Docker 与认证数据库的核心就绪状态
      tags: [system]
      responses:
        '200':
          description: 核心依赖可用；可选代理模块不参与核心就绪判断
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: 核心依赖不可用或共享探测超时；不包含底层错误或宿主机数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Get Root account initialization and current session status
      tags: [auth]
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '503':
          description: Authentication database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapRootAccount
      summary: Create the first Root account and start a session
      tags: [auth]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '201':
          description: Root account created and session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Root account was already initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 认证服务暂不可用（AUTH_UNAVAILABLE，含 requestId）。账号可能已经创建，但会话未建立且不设置 Cookie；客户端应先只读查询 /api/v1/auth/status 确认初始化与认证状态，不得自动重放 bootstrap 或 login。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginRootAccount
      summary: Start a Root session
      tags: [auth]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: Session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 认证服务暂不可用（AUTH_UNAVAILABLE，含 requestId）；未建立新会话，不设置 Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logoutRootAccount
      summary: End the current Root session
      tags: [auth]
      responses:
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '204':
          description: Session cleared
        '503':
          description: 认证服务暂不可用（AUTH_UNAVAILABLE，含 requestId）；会话撤销未获确认，不清除 Cookie，客户端不得当作已退出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 列出全部等权 Root 账号
      tags: [users]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 按用户名排序的账号列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedUser'
    post:
      operationId: createUser
      summary: 创建一个等权 Root 账号
      tags: [users]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '201':
          description: 账号已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userID}/status:
    put:
      operationId: updateUserStatus
      summary: 启用或禁用账号
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '409':
          description: 当前账号或最后可用账号受保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/password-policy:
    get:
      operationId: getPasswordPolicy
      summary: 读取当前密码长度与字符类型规则
      tags: [users]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 当前密码规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
    put:
      operationId: updatePasswordPolicy
      summary: 更新新密码和新账号使用的密码规则
      tags: [users]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: 已保存的密码规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
  /api/v1/users/{userID}/password:
    put:
      operationId: updateUserPassword
      summary: 修改自己的密码或重置其他账号密码
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 8192 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 1, maxLength: 256 }
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '204':
          description: 密码已更新且目标账号全部会话已撤销
        '401':
          description: 当前密码不正确
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userID}:
    delete:
      operationId: deleteUser
      summary: 删除非当前账号
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '204':
          description: 账号及其全部会话已删除
        '409':
          description: 当前账号或最后可用账号受保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/preferences:
    get:
      operationId: getUserPreferences
      summary: Get preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Current user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      operationId: updateUserPreferences
      summary: Update preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 16384 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Invalid preference value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/preferences/lists/{listKey}:
    get:
      operationId: getListPreference
      summary: 读取一个资源列表的分页与排序偏好
      tags: [settings]
      security: [{RootSession: []}]
      parameters:
        - { name: listKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 列表偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPreference'
    put:
      operationId: updateListPreference
      summary: 保存一个资源列表的分页与排序偏好
      tags: [settings]
      security: [{RootSession: []}]
      parameters:
        - { name: listKey, in: path, required: true, schema: { type: string } }
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 16384 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPreference'
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: 已保存的列表偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPreference'
  /api/v1/monitoring/alerts:
    get:
      operationId: getResourceAlerts
      summary: 读取当前运行期 CPU 与内存资源提示
      description: >-
        默认关闭，只有 Server --resource-alerts 启用。只读既有采集器的内存状态，
        不触发采样、历史查询或持久化；GET 与 observedAt 不推进触发或恢复计时。
        规则按约 5 秒采样判断，采样间变化不可知，不代表 NAS 整体健康。
        condition 与 availability 独立；unknown/stale 不能视为正常，已触发事件失联不会自动恢复。
        样本数据时间或接收时间年龄超过 15 秒为 stale；明确失败优先 unknown。
        仅本次 Server 运行期有效，重启丢失；最近恢复时间保留不足 24 小时。
        完整 JSON（含末尾换行）最多 8192 字节，超限显式错误，不截断成功响应。
      tags: [monitoring]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 完整当前状态；包括 enabled=false、无样本 unknown 和数据 stale。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceAlertsSnapshot'}
        '401':
          description: AUTH_UNAUTHORIZED；需要 Root 会话。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: MONITORING_ALERTS_RESPONSE_INVALID 或 MONITORING_ALERTS_LIMIT_EXCEEDED；没有部分成功响应。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: MONITORING_ALERTS_UNAVAILABLE 表示 provider 缺失或已停止；AUTH_UNAVAILABLE 表示认证后端暂不可用。配置关闭正常返回 200。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/monitoring/samples:
    get:
      operationId: listMetricSamples
      summary: Read persisted host metric samples
      description: >-
        历史由服务端后台独立采集，无需浏览器保持连接，HTTP 概览和实时流请求不写入历史。
        每个 UTC 分钟仅保存首个合格且成功持久化的完整样本及其温度子样本，保留 7 天。
        必需指标源不可用、样本无效或持久化失败可能形成间断，不补零或插值；缺失温度不生成子样本。
        查询为精确闭区间（含小数秒），父样本及其温度来自同一数据库快照，按时间升序。
        单次完整响应最多 10,081 个父样本、65,536 个温度子样本及 8 MiB JSON（含末尾换行）。
        七天每分钟六个普通短名称传感器通常在预算内；更多传感器、较长名称或较大数字可能需缩短查询范围。
        超限返回 MONITORING_HISTORY_LIMIT_EXCEEDED，请缩短范围重试；绝不返回截断的成功数组，
        也不因响应预算删除仍在保留期内的旧版数据。单个旧样本本身超限时，需排除该时间点。
        SQL 查询与编码共享 5 秒协作式超时，超时返回 MONITORING_READ_TIMEOUT；客户端取消会取消查询。
        此预算约束应用层结果与编码体积，不保证 SQLite 驱动、查询工作区峰值内存或数据库文件大小。
      tags: [monitoring]
      security: [{RootSession: []}]
      parameters:
        - name: range
          in: query
          description: 预设 1h、6h、24h 或 7d；缺省及未知值均回退 6h。成对 from/to 优先。
          schema: { type: string, default: 6h }
        - name: from
          in: query
          description: 精确范围起点（包含边界、支持小数秒）；必须与 to 成对提供，优先于 range。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 精确范围终点（包含边界、支持小数秒）；最多晚于服务当前时间 1 分钟，必须晚于 from，最长跨度 7 天。
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 完整范围内的历史样本，按采集时间升序；空结果返回 []。
          content:
            application/json:
              schema:
                type: array
                maxItems: 10081
                items:
                  $ref: '#/components/schemas/MetricSample'
        '400':
          description: MONITORING_RANGE_INVALID；起止未成对、时间无效、跨度超过 7 天或终点超过允许的 1 分钟未来容差。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MONITORING_HISTORY_LIMIT_EXCEEDED；完整响应超过父样本、温度行数或编码字节预算，请缩短范围。没有部分成功结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: MONITORING_HISTORY_INVALID 表示保留的旧历史包含无法完整编码的无效数据；MONITORING_READ_FAILED 表示其他存储读取失败。原始数据不被修改，不返回存储错误细节。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: MONITORING_STORE_UNAVAILABLE；未提供有上下界的历史存储接口，不回退到无界查询。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: MONITORING_READ_TIMEOUT；查询或编码超过 5 秒协作式预算，请缩短范围重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/project-preferences:
    get:
      operationId: listDatabaseProjectPreferences
      summary: List persisted database project preferences
      tags: [databases]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Database project preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseProjectPreference'
    put:
      operationId: updateDatabaseProjectPreference
      summary: Persist one database project preference
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 16384 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseProjectPreference'
      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: Updated database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseProjectPreference'
        '400':
          description: Invalid database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/discovery:
    get:
      operationId: discoverDatabases
      summary: 发现宿主机和项目数据库
      tags: [databases]
      security: [{RootSession: []}]
      parameters:
        - name: refresh
