openapi: 3.1.1
info:
  title: NAS Control Plane API
  version: 0.1.0
  description: Phase 0 的 API 契约。能力信息只能由 ncp-agent 的受控接口提供。
paths:
  /healthz:
    get:
      operationId: getServerHealth
      summary: 获取 NCP Server 健康状态
      tags: [system]
      responses:
        '200':
          description: Server 可响应 HTTP 请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Get Root account initialization and current session status
      tags: [auth]
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '503':
          description: Authentication database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapRootAccount
      summary: Create the first Root account and start a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: Root account created and session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Root account was already initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginRootAccount
      summary: Start a Root session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logoutRootAccount
      summary: End the current Root session
      tags: [auth]
      responses:
        '204':
          description: Session cleared
  /api/v1/preferences:
    get:
      operationId: getUserPreferences
      summary: Get preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Current user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      operationId: updateUserPreferences
      summary: Update preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Invalid preference value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/project-preferences:
    get:
      operationId: listDatabaseProjectPreferences
      summary: List persisted database project preferences
      tags: [databases]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Database project preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseProjectPreference'
    put:
      operationId: updateDatabaseProjectPreference
      summary: Persist one database project preference
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseProjectPreference'
      responses:
        '200':
          description: Updated database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseProjectPreference'
        '400':
          description: Invalid database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: 获取 NAS 环境能力
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 已完成只读探测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          description: Agent 不可用或探测源不可读
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/agent-status:
    get:
      operationId: getAgentStatus
      summary: 获取 Agent Socket 状态
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Agent Socket 可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '503':
          description: Agent Socket 不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/summary:
    get:
      operationId: getSystemSummary
      summary: Get a live NAS host summary
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Live host metrics collected by Root Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSummary'
        '503':
          description: Root Agent or a required metric source is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/events:
    get:
      operationId: streamSystemEvents
      parameters:
        - name: interval
          in: query
          required: false
          description: Snapshot interval in seconds
          schema:
            type: integer
            minimum: 2
            maximum: 300
            default: 5
      summary: 订阅控制台实时刷新事件
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 每 5 秒发送一次 snapshot 事件
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Root 会话无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/inventory:
    get:
      operationId: getDockerInventory
      summary: Get Docker Engine, container, and Compose project inventory
      tags: [docker]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Live Docker inventory collected by Root Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerInventory'
        '503':
          description: Root Agent or Docker Engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/images:
    get:
      operationId: listDockerImages
      summary: List local Docker images
      tags: [docker]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Local Docker image inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerImageInventory'
        '503':
          description: Root Agent or Docker Engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/hub/search:
    get:
      operationId: searchDockerHub
      summary: Search public image repositories on Docker Hub
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Matching public repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerHubSearchResult'
  /api/v1/docker/hub/tags:
    get:
      operationId: listDockerHubTags
      summary: List recent tags and architectures for a Docker Hub repository
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - { name: namespace, in: query, required: true, schema: { type: string } }
        - { name: repository, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Repository tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerHubTagsResult'
  /api/v1/docker/images/pull:
    post:
      operationId: pullDockerImage
      summary: Pull an explicitly tagged image from Docker Hub or another registry
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerImagePullRequest'
      responses:
        '202':
          description: Image pull job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
        '400':
          description: Invalid image reference or pull failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/compose/config/read:
    post:
      operationId: readComposeConfig
      summary: Read discovered Compose project configuration files
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeReadRequest'
      responses:
        '200':
          description: Compose project configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeProjectConfig'
  /api/v1/docker/compose/config/validate:
    post:
      operationId: validateComposeConfig
      summary: Validate an edited Compose configuration without saving it
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeValidateRequest'
      responses:
        '200':
          description: Valid normalized Compose configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeValidationResult'
        '422':
          description: Invalid YAML or Compose configuration
  /api/v1/docker/compose/drafts:
    get:
      operationId: getComposeDraft
      summary: Read one server-persisted Compose draft
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
        - { name: configPath, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Saved Compose draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeDraft'
        '404':
          description: Draft does not exist
    put:
      operationId: saveComposeDraft
      summary: Persist one Compose draft in NCP SQLite
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeDraftInput'
      responses:
        '200':
          description: Saved Compose draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeDraft'
  /api/v1/docker/compose/deploy:
    post:
      operationId: deployComposeConfig
      summary: Validate, back up, atomically save and deploy a Compose project
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeDeployInput'
      responses:
        '202':
          description: Compose deployment job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
  /api/v1/docker/compose/revisions:
    get:
      operationId: listComposeRevisions
      summary: List recorded successful Compose deployments
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recent Compose deployment versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComposeRevision'
  /api/v1/docker/images/remove:
    post:
      operationId: removeDockerImage
      summary: Remove one local image without force
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerImageRemoveRequest'
      responses:
        '200':
          description: Image removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerImageRemoveResult'
        '409':
          description: Image is in use or could not be removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{jobID}:
    get:
      operationId: getJob
      summary: Get current background job status
      tags: [jobs]
      security: [{RootSession: []}]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current job snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
  /api/v1/jobs/{jobID}/events:
    get:
      operationId: followJob
      summary: Follow background job progress over SSE
      tags: [jobs]
      security: [{RootSession: []}]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream progress snapshots
  /api/v1/services:
    get:
      operationId: listServices
      summary: List discovered Compose projects and standalone containers
      tags: [services]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Service list derived from the live Docker inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '503':
          description: Root Agent or Docker Engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sites:
    get:
      operationId: listSites
      summary: List automatically discovered NAS websites with editable profiles
      tags: [sites]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Sites derived from live Docker inventory and saved profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'
        '503':
          description: Root Agent, Docker Engine, or site store is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sites/{projectID}:
    put:
      operationId: updateSiteProfile
      summary: Update editable metadata for one discovered NAS website
      tags: [sites]
      security: [{RootSession: []}]
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteProfileInput'
      responses:
        '200':
          description: Updated site profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteProfileInput'
        '400':
          description: Invalid site profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sites/{projectID}/visit:
    post:
      operationId: recordSiteVisit
      summary: Record a site launch for recent-access ordering
      tags: [sites]
      security: [{RootSession: []}]
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Recorded site visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisitResponse'
        '400':
          description: Invalid project identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/containers/{containerID}/actions/{action}:
    post:
      operationId: controlDockerContainer
      summary: Start, stop, or restart one Docker container
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - name: containerID
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, restart]
      responses:
        '200':
          description: Container lifecycle action completed and current state inspected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerActionResult'
        '400':
          description: Unsupported action or missing container identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Root Agent or Docker Engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/containers/{containerID}/logs:
    get:
      operationId: getDockerContainerLogs
      summary: Read a bounded tail of one container's logs
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - name: containerID
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: tail
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        '200':
          description: Bounded stdout and stderr log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLogsResult'
        '400':
          description: Invalid container identifier or tail size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Root Agent or Docker Engine is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ws/terminal:
    get:
      operationId: openTerminalPOCWebSocket
      summary: 打开受控 P0 终端 WebSocket
      description: 仅在 `ncp-server serve --terminal-poc` 显式启用；仅支持固定 host 或受标签保护的临时 container 目标，不接受命令、Shell、路径或容器 ID。
      tags: [terminal]
      security: [{RootSession: []}]
      parameters:
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [host, container]
      responses:
        '101':
          description: WebSocket 已切换协议。二进制帧承载终端输入/输出，文本帧承载 resize、close 与会话状态。
        '400':
          description: 终端目标或握手参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未启用 P0 终端通道
components:
  schemas:
    UserPreferences:
      type: object
      required: [refreshIntervalSeconds, interfaceDensity, baseFontSize, pageSize, sidebarDefault, linkOpenMode, siteDefaultProtocol, chineseFont, latinFont]
      properties:
        refreshIntervalSeconds:
          type: integer
          minimum: 2
          maximum: 300
          default: 5
        interfaceDensity:
          type: string
          enum: [comfortable, compact]
        baseFontSize:
          type: integer
          minimum: 13
          maximum: 18
        pageSize:
          type: integer
          enum: [20, 25, 50, 100]
        sidebarDefault:
          type: string
          enum: [collapsed, expanded]
        linkOpenMode:
          type: string
          enum: [new-tab, same-tab]
        siteDefaultProtocol:
          type: string
          enum: [http, https]
        chineseFont:
          type: string
          enum: [system, noto-sans-sc]
        latinFont:
          type: string
          enum: [system, manrope]
    DatabaseProjectPreference:
      type: object
      required: [projectKey, archived]
      properties:
        projectKey:
          type: string
          minLength: 1
          maxLength: 512
        archived:
          type: boolean
    SiteProfileInput:
      type: object
      required: [projectId, name, description, iconUrl, category, launchUrl, primaryPort, favorite, sortOrder, hidden]
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        iconUrl:
          type: string
          maxLength: 2048
        category:
          type: string
          maxLength: 64
        launchUrl:
          type: string
          maxLength: 2048
        primaryPort:
          type: integer
          minimum: 0
          maximum: 65535
        favorite:
          type: boolean
        sortOrder:
          type: integer
          minimum: -100000
          maximum: 100000
        hidden:
          type: boolean
    Site:
      allOf:
        - $ref: '#/components/schemas/SiteProfileInput'
        - type: object
          required: [id, state, ports, source, lastVisitedAt]
          properties:
            id: { type: string }
            state: { type: string }
            ports:
              type: array
              items: { type: integer, minimum: 1, maximum: 65535 }
            source:
              type: string
              enum: [auto, labels, built-in, edited]
            lastVisitedAt:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
    SiteListResponse:
      type: object
      required: [collectedAt, sites]
      properties:
        collectedAt:
          type: string
          format: date-time
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'
    SiteVisitResponse:
      type: object
      required: [projectId, lastVisitedAt]
      properties:
        projectId:
          type: string
        lastVisitedAt:
          type: string
          format: date-time
    CredentialsRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    Principal:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, minimum: 1 }
        username: { type: string }
        role:
          type: string
          enum: [root]
    AuthStatusResponse:
      type: object
      required: [initialized, authenticated]
      properties:
        initialized: { type: boolean }
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/Principal'
            - type: 'null'
    AuthSessionResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/Principal'
        expiresAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          examples: [ok]
        service:
          type: string
          examples: [ncp-server]
    AgentStatus:
      type: object
      required: [protocolVersion, agentEUID, transport]
      properties:
        protocolVersion:
          type: string
          examples: [p0-v1]
        agentEUID:
          type: integer
          minimum: 0
        transport:
          type: string
          examples: [unix]
    SystemSummary:
      type: object
      required: [collectedAt, host, cpu, memory, storage, network, warnings]
      properties:
        collectedAt:
          type: string
          format: date-time
        host:
          $ref: '#/components/schemas/HostSnapshot'
        cpu:
          $ref: '#/components/schemas/CpuStats'
        memory:
          $ref: '#/components/schemas/MemoryStats'
        storage:
          type: array
          items:
            $ref: '#/components/schemas/DiskStats'
        network:
          type: array
          items:
            $ref: '#/components/schemas/NetworkStats'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SummaryWarning'
    HostSnapshot:
      type: object
      properties:
        hostname: { type: string }
        operatingSystem: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        processCount: { type: integer, minimum: 0 }
    CpuStats:
      type: object
      properties:
        usagePercent: { type: number, minimum: 0 }
        logicalCores: { type: integer, minimum: 0 }
        load1: { type: number, minimum: 0 }
        load5: { type: number, minimum: 0 }
        load15: { type: number, minimum: 0 }
    MemoryStats:
      type: object
      properties:
        totalBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        availableBytes: { type: integer, minimum: 0 }
    DiskStats:
      type: object
      properties:
        mountpoint: { type: string }
        totalBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        freeBytes: { type: integer, minimum: 0 }
    NetworkStats:
      type: object
      properties:
        name: { type: string }
        receiveBytes: { type: integer, minimum: 0 }
        transmitBytes: { type: integer, minimum: 0 }
    SummaryWarning:
      type: object
      required: [code, source]
      properties:
        code: { type: string, examples: [SYSTEM_SUMMARY_SOURCE_UNAVAILABLE] }
        source: { type: string }
    DockerInventory:
      type: object
      required: [collectedAt, engine, containers, projects]
      properties:
        collectedAt:
          type: string
          format: date-time
        engine:
          $ref: '#/components/schemas/DockerEngineInfo'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/InventoryContainer'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/DockerProject'
    DockerImageInventory:
      type: object
      required: [collectedAt, images]
      properties:
        collectedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/DockerImageSummary'
    DockerImageSummary:
      type: object
      required: [id, repoTags, repoDigests, sizeBytes, createdAt, containers]
      properties:
        id: { type: string }
        repoTags:
          type: array
          items: { type: string }
        repoDigests:
          type: array
          items: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        createdAt:
          type: string
          format: date-time
        containers: { type: integer }
    DockerImagePullRequest:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 512
          examples: [nginx:alpine]
    DockerImagePullResult:
      type: object
      required: [reference, completed]
      properties:
        reference: { type: string }
        completed: { type: boolean }
    JobSnapshot:
      type: object
      required: [id, type, status, message, progress, createdAt, updatedAt]
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        reference: { type: string }
        message: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DockerImageRemoveRequest:
      type: object
      required: [imageId]
      properties:
        imageId:
          type: string
          minLength: 1
          maxLength: 512
    ComposeReadRequest:
      type: object
      required: [projectId, workingDirectory, configFiles]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        configFiles:
          type: array
          minItems: 1
          items: { type: string }
    ComposeProjectConfig:
      type: object
      required: [projectId, workingDirectory, files, collectedAt]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        files:
          type: array
          items:
            $ref: '#/components/schemas/ComposeFileSnapshot'
        collectedAt: { type: string, format: date-time }
    ComposeFileSnapshot:
      type: object
      required: [path, name, content, size]
      properties:
        path: { type: string }
        name: { type: string }
        content: { type: string }
        size: { type: integer, minimum: 0 }
    ComposeValidateRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, maxLength: 2097152 }
    ComposeValidationResult:
      type: object
      required: [valid, services, normalized]
      properties:
        valid: { type: boolean }
        services:
          type: array
          items: { type: string }
        normalized: { type: string }
    ComposeDraftInput:
      type: object
      required: [projectId, configPath, content]
      properties:
        projectId: { type: string, maxLength: 256 }
        configPath: { type: string, maxLength: 2048 }
        content: { type: string, maxLength: 2097152 }
    ComposeDraft:
      allOf:
        - $ref: '#/components/schemas/ComposeDraftInput'
        - type: object
          required: [contentHash, updatedAt]
          properties:
            contentHash: { type: string }
            updatedAt: { type: string, format: date-time }
    ComposeDeployInput:
      type: object
      required: [projectId, workingDirectory, configFiles, targetPath, content]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        configFiles:
          type: array
          minItems: 1
          items: { type: string }
        targetPath: { type: string }
        content: { type: string, maxLength: 2097152 }
    ComposeRevision:
      type: object
      required: [id, projectId, configPath, content, contentHash, backupPath, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        projectId: { type: string }
        configPath: { type: string }
        content: { type: string }
        contentHash: { type: string }
        backupPath: { type: string }
        createdAt: { type: string, format: date-time }
    DockerImageRemoveResult:
      type: object
      required: [imageId, removed]
      properties:
        imageId: { type: string }
        removed: { type: boolean }
    DockerHubSearchResult:
      type: object
      required: [count, page, pageSize, results]
      properties:
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/DockerHubRepository'
    DockerHubRepository:
      type: object
      required: [name, namespace, description, starCount, pullCount, official, publisher, lastUpdated, repositoryType, statusDescription]
      properties:
        name: { type: string }
        namespace: { type: string }
        description: { type: string }
        starCount: { type: integer, minimum: 0 }
        pullCount: { type: integer, minimum: 0 }
        official: { type: boolean }
        publisher: { type: string }
        lastUpdated: { type: string }
        repositoryType: { type: string }
        statusDescription: { type: string }
    DockerHubTagsResult:
      type: object
      required: [count, page, pageSize, results]
      properties:
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/DockerHubTag'
    DockerHubTag:
      type: object
      required: [name, lastUpdated, fullSize, architectures]
      properties:
        name: { type: string }
        lastUpdated: { type: string }
        fullSize: { type: integer, minimum: 0 }
        architectures:
          type: array
          items: { type: string }
    DockerEngineInfo:
      type: object
      properties:
        serverVersion: { type: string }
        operatingSystem: { type: string }
        architecture: { type: string }
        containers: { type: integer, minimum: 0 }
        containersRunning: { type: integer, minimum: 0 }
        containersStopped: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
    InventoryContainer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        createdAt:
          type: string
          format: date-time
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortMapping'
        projectId: { type: string }
        projectName: { type: string }
        serviceName: { type: string }
    PortMapping:
      type: object
      properties:
        hostIp: { type: string }
        privatePort: { type: integer, minimum: 0 }
        publicPort: { type: integer, minimum: 0 }
        protocol: { type: string }
    DockerProject:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [compose, standalone]
        state:
          type: string
          enum: [running, stopped, degraded]
        workingDirectory: { type: string }
        configFiles:
          type: array
          items: { type: string }
        containerCount: { type: integer, minimum: 0 }
        runningCount: { type: integer, minimum: 0 }
    ContainerActionResult:
      type: object
      required: [containerId, name, action, state]
      properties:
        containerId: { type: string }
        name: { type: string }
        action:
          type: string
          enum: [start, stop, restart]
        state: { type: string }
    ContainerLogsResult:
      type: object
      required: [containerId, tail, collectedAt, entries]
      properties:
        containerId: { type: string }
        tail: { type: integer, minimum: 1, maximum: 500 }
        collectedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ContainerLogEntry'
    ContainerLogEntry:
      type: object
      required: [stream, message]
      properties:
        stream:
          type: string
          enum: [stdout, stderr]
        message: { type: string }
    ServiceListResponse:
      type: object
      required: [collectedAt, services]
      properties:
        collectedAt:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/DockerProject'
    Capabilities:
      type: object
      required:
        - architecture
        - docker
        - compose
        - systemd
        - journald
        - cgroupVersion
        - procReadable
        - sysReadable
        - smartctl
        - nvmeCli
        - hostTerminal
        - rootFilesystemWritable
      properties:
        hostname:
          type: string
        architecture:
          type: string
          examples: [arm64]
        operatingSystem:
          $ref: '#/components/schemas/OperatingSystem'
        deviceModel:
          type: [string, 'null']
        docker:
          type: boolean
        dockerApiVersion:
          type: [string, 'null']
        compose:
          type: boolean
        composeVersion:
          type: [string, 'null']
        systemd:
          type: boolean
        journald:
          type: boolean
        cgroupVersion:
          type: integer
          minimum: 0
          description: 0 表示未识别，1 与 2 分别表示 cgroup v1、v2。
        procReadable:
          type: boolean
        sysReadable:
          type: boolean
        smartctl:
          type: boolean
        nvmeCli:
          type: boolean
        temperatureSensors:
          type: array
          items:
            type: string
        dataVolumes:
          type: array
          items:
            type: string
        networkInterfaces:
          type: array
          items:
            type: string
        canManageSystemUsers:
          type: boolean
        rootFilesystemWritable:
          type: boolean
        hostTerminal:
          type: boolean
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ProbeWarning'
    OperatingSystem:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        prettyName:
          type: string
    ProbeWarning:
      type: object
      required: [code]
      properties:
        code:
          type: string
          examples: [PROBE_SOURCE_UNAVAILABLE]
        source:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
  securitySchemes:
    RootSession:
      type: apiKey
      in: cookie
      name: ncp_session
