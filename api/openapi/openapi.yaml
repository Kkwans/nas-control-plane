      responses:
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/DatabaseResultTooLarge'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: SQL 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
        '400':
          description: 请求格式无效（DATABASE_INPUT_INVALID）、SQL 或模式无效（sql_invalid），或 Agent 不支持显式模式（result_mode_unsupported）；不支持时 SQL 不会执行，应先升级 Agent。 TLS 配置无效（tls_configuration_invalid）、所需策略不受支持（tls_policy_unsupported）或证书/身份验证失败（tls_verification_failed）均返回 400；这些诊断不保证 SQL 未执行或本次凭据未保存。
