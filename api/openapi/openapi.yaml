        '503':
          description: 数据库不可用；已配置但缺少受保护的解析能力时返回 credential_store_unavailable，不降级到直接连接。 operation_busy 表示 Agent 的单个数据库 Manager 已达到固定 4 个池操作的并发上限；不排队，不自动重试。预算覆盖将创建 SQL 池的 Manager 操作，从准入开始计数，直到池关闭才释放；独立来源发现、Server 端连接解析及凭据服务不在预算内，不保证整条请求没有副作用，也不保证凭据未保存。
