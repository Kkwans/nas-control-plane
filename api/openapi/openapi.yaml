  /api/v1/jobs/{jobID}/events:
    get:
      operationId: followJob
      summary: Follow background job progress over SSE
      description: >-
        流建立前重新验证数据库会话并登记实时租约；注销、改密、账号禁用、删除及会话到期取消相应观察流。
        每帧 Write 与 Flush 共用 5 秒 deadline；不支持有界写入时在响应提交前拒绝。
        关闭观察流不会取消、删除或改变已接受 Job 的状态，重新登录后可继续观察。
      tags: [jobs]
      security: [{RootSession: []}]
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream progress snapshots；取消请求中及结果待保存时继续发送，持久化终态后结束。
          content:
            text/event-stream:
              schema: { type: string }
        '501':
          description: JOB_STREAM_UNSUPPORTED：当前连接不支持有界 SSE 写入。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: AUTH_UNAUTHORIZED；Root 会话不存在、已撤销、已到期或账号已禁用；在流建立前拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AUTH_STREAM_UNAVAILABLE 或 AUTH_STREAM_LIMIT_REACHED；实时认证能力不可用或四类流共享的服务租约额度已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/job-history:
    get:
      operationId: listJobHistory
      summary: 分页读取最后保存的任务历史
      description: |
        只读持久摘要，可能落后于当前执行，不代表当前资源状态。不查询 Agent，不提供任务动作。
        按创建时间秒及 ID 倒序 keyset 遍历，无跨页快照保证或总数。并发创建须回到最新页查看，并发删除可使后续页变短。
        RawQuery 最多 8192 字节；未知或重复参数、坏转义、分号字段均拒绝。完整 JSON 最多 1 MiB，超限不返回部分页面。
      tags: [jobs]
      security: [{RootSession: []}]
      parameters:
        - name: type
          in: query
          description: 省略或空串为全部；非空按原值精确匹配，不 trim。最多 128 UTF-8 字节，不接受控制字符，允许未来类型。
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          description: 省略取 50；显式值仅接受十进制整数 1–100。
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: 服务端返回的版本化、不透明游标，与 type 逐字绑定；最多 2048 字节。不得重新编码，空串无效。不是权限票据。
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: 最后保存的有界摘要页；Cache-Control 为 no-store
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobHistoryPage' }
        '400':
          description: JOB_HISTORY_INVALID_QUERY；参数或游标无效，不回退到默认查询
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: AUTH_UNAUTHORIZED；需要有效 Root 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501':
          description: JOB_HISTORY_UNSUPPORTED；实际 JobEngine 没有支持历史读取的持久层
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: JOB_HISTORY_UNAVAILABLE、JOB_HISTORY_CORRUPT 或 JOB_HISTORY_TOO_LARGE；读取失败、无法表示的数据或编码超限。不是空历史，不自动重试执行任务。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
