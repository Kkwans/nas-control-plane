  /api/v1/system/events:
    get:
      operationId: streamSystemEvents
      parameters:
        - name: interval
          in: query
          required: false
          description: 读取缓存并发送 snapshot 的秒数，不控制主机采集；缺省或非法值回退 5 秒，同一 collectedAt 可以重复发送
          schema:
            type: integer
            minimum: 2
            maximum: 300
            default: 5
        - name: scope
          in: query
          required: false
          style: form
          explode: true
          description: 可重复指定 summary 和 docker；未提供或全部不识别时回退 summary。docker-only 不读取主机快照，也不携带主机历史错误
          schema:
            type: array
            items:
              type: string
              enum: [summary, docker]
      summary: 订阅控制台实时刷新事件
      description: >-
        保留 retry 行和 snapshot 事件，事件 data 为 RealtimeSnapshot JSON；新连接立即发送当前状态。
        summary 与 Docker 只读各自共享缓存，不触发每连接主机/Docker RPC或历史写入。
        Docker仅在有docker scope订阅时由单worker按5秒节拍采集，源RPC预算5秒；冷启动、失败或双年龄过期时省略docker并返回源不可用状态。
        最后一个Docker订阅释放会取消在途采集与周期工作；GET inventory/services/sites通过同一采集器的强刷新屏障读取，要求采集开始不早于该刷新请求；最多64个unary等待者，HTTP等待预算12秒，源RPC预算5秒。
        Docker事件订阅首次建立和每次重连均要求全量对账；恢复中不以旧清单或回退轮询冒充健康，返回既有DOCKER_INVENTORY_UNAVAILABLE。
        Server与Agent须同时支持事件RPC，旧Agent缺失能力时明确不可用，不静默降级宣称事件恢复。
        外层 collectedAt 是发送事件的服务时间，内层 collectedAt 才是资源采集时间。
        每 15 秒发送 comment heartbeat，不产生 snapshot，也不证明数据新鲜；正在写入可延迟该节拍，Docker采集不阻塞summary或heartbeat。
        每次写入/flush 有 5 秒 deadline，完成后清除；请求取消或所订阅快照 provider 停止会关闭相应流。
        长连接建立前重新验证数据库会话并申请服务内租约（默认总上限 256，四类流共享）；
        注销仅撤销当前会话，改密、禁用或删除账号撤销该用户全部会话；到期无需等待下个 interval 即触发取消。
        取消不会停止其他订阅或主机采集器；Docker最后订阅释放例外；正在进行的写入最多等待当前 5 秒预算。
        不保证每个采样均送达，无重放；客户端必须按内层时间去重并独立判断 15 秒新鲜度。
        每个服务 Handler 的全部 scope 共享最多 64 条连接，不宣称共享编码或整个服务的硬内存上限。
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 按 interval 发送最新 snapshot，默认 5 秒；源不可用时省略 summary，warnings 与历史错误分别保留
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE data 使用 components/schemas/RealtimeSnapshot 定义的 JSON
        '503':
          description: AUTH_STREAM_UNAVAILABLE 或 AUTH_STREAM_LIMIT_REACHED；实时认证能力不可用或服务租约额度已满。REALTIME_SUBSCRIBER_LIMIT 表示此 Handler 超过 64 条连接。均在提交流响应前拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: REALTIME_STREAM_UNSUPPORTED；响应 writer 不支持有界实时流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Root 会话无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
