        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: Image removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerImageRemoveResult'
        '409':
          description: Image is in use or could not be removed
