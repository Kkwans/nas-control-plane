    post:
      operationId: connectDatabase
      summary: 使用已保存或手动提供的凭据连接数据库
      description: 手动凭据先测试，再以读取时的版本条件保存；冲突不会自动覆盖或重试。credential_conflict 仅保证本次尝试未写入凭据，不表示连接测试成功，也不表示其他请求没有保存凭据；用户需重新确认后手动重试。其他错误不提供本次凭据未写入的保证。
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。 完整请求体最多 1048576 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。 credentials.tls 仅接受显式 verify-full 策略；出现 TLS 键时，sourceId、credentials 和凭据/策略字段必须使用唯一、规范拼写。null、空策略、未知字段、重复对象或键、大小写及 Unicode 折叠别名、非字符串策略值均在发现来源或调用凭据服务/Agent 前以 400 DATABASE_INPUT_INVALID 拒绝。省略 tls 会继承已保存的严格策略，不表示关闭；没有已保存策略时保留既有连接行为。严格策略失败或旧 Agent 不支持时不移除 TLS，也不回退重试。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseConnectRequest'
      responses:
        '400':
          description: 请求格式或凭据无效（DATABASE_INPUT_INVALID）。TLS 配置无效（tls_configuration_invalid）、所需策略不受支持（tls_policy_unsupported）或证书/身份验证失败（tls_verification_failed）均返回 400；这些诊断不保证 SQL 未执行或本次凭据未保存。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/DatabaseResultTooLarge'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '200':
          description: 连接诊断结果；不会返回密码、Token 或 DSN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseConnectionDiagnostic'
        '401':
          description: 数据库认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 数据库来源或数据库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: credential_conflict 表示凭据版本冲突，本次尝试没有写入凭据；可发生在连接测试阶段，或测试成功后的条件保存阶段，不能据此判断测试成功。重新确认后手动重试，不自动重发。constraint_failed 仍表示数据库约束失败，不适用该凭据保证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                credentialConflict:
                  summary: 本次凭据未保存，其他请求可能已保存新凭据
                  value:
                    code: credential_conflict
                    message: 凭据已被其他请求更改，本次凭据未保存，请重新确认后手动重试。
                    requestId: req-example
        '503':
          description: 数据库或凭据服务不可用；credential_store_unavailable 表示凭据服务未能完成请求，不保证本次凭据未保存。 operation_busy 表示 Agent 的单个数据库 Manager 已达到固定 4 个池操作的并发上限；不排队，不自动重试。预算覆盖将创建 SQL 池的 Manager 操作，从准入开始计数，直到池关闭才释放；独立来源发现、Server 端连接解析及凭据服务不在预算内，不保证整条请求没有副作用，也不保证凭据未保存。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
