  /api/v1/logs:
    get:
      operationId: queryLogCenter
      summary: Query systemd journal or Docker container logs
      tags: [logs]
      security: [{RootSession: []}]
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [system, agent, container], default: system } }
        - { name: containerId, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [all, error, warning, info, debug], default: all } }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 168, default: 6 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 150 } }
      responses:
        '200':
          description: >-
            规范化的日志条目。系统与Agent日志仅对已识别的敏感模式进行脱敏；容器日志不保证脱敏。
            所有来源仍可能包含敏感信息，导出或分享前应检查内容。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogResponse'
        '503':
          description: Root Agent or requested log source is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/logs/events:
    get:
      operationId: streamLogEvents
      summary: 订阅日志实时事件
      description: >-
        流建立前重新验证数据库会话并登记实时租约；注销、改密、账号禁用、删除及会话到期取消相应观察流。
        初始帧、日志事件及 heartbeat 的 Write 与 Flush 均共用 5 秒 deadline；不支持有界写入时在响应提交前拒绝。
      tags: [logs]
      security: [{RootSession: []}]
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [system, agent, container], default: system } }
        - { name: containerId, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [all, error, warning, info, debug], default: all } }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
        - { name: interval, in: query, schema: { type: integer, minimum: 2, maximum: 300, default: 5 } }
      responses:
        '200':
          description: Server-Sent Events 日志流
          content:
            text/event-stream:
              schema: { type: string }
        '503':
          description: 日志实时流不可用；AUTH_STREAM_UNAVAILABLE 或 AUTH_STREAM_LIMIT_REACHED 表示实时认证能力不可用或服务租约额度已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: AUTH_UNAUTHORIZED；Root 会话不存在、已撤销、已到期或账号已禁用；在流建立前拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: LOG_STREAM_UNSUPPORTED；响应 writer 不支持有界实时流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ws/terminal:
    get:
      operationId: openTerminalWebSocket
      summary: 打开 NAS 主机或 Docker 容器终端 WebSocket
      description: >-
        通过 Root Agent 创建独立 PTY 会话；二进制帧传输输入输出，文本帧传输 resize、close 与 started 状态消息。
        升级前重新验证数据库会话并登记实时租约。注销仅撤销当前会话；改密、禁用或删除账号撤销该用户全部会话。
        会话撤销或到期立即取消 Server 输入输出并关闭浏览器与 Agent RPC 传输，既有终端超时仍生效。
        关闭传输不等于确认所有容器 exec、PTY 子孙进程或已提交 Root 命令均已终止。
      tags: [terminal]
      security: [{RootSession: []}]
      parameters:
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [host, container]
        - name: containerId
          in: query
          required: false
          description: target 为 container 时必填，只接受运行中容器的 ID 或名称。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: rows
          in: query
          required: false
          description: 初始终端行数；必须与 cols 同时提供。
          schema: { type: integer, minimum: 1, maximum: 200, default: 24 }
        - name: cols
          in: query
          required: false
          description: 初始终端列数；必须与 rows 同时提供。
          schema: { type: integer, minimum: 1, maximum: 400, default: 80 }
      responses:
        '101':
          description: WebSocket 已切换协议。二进制帧承载终端输入/输出；文本帧承载 resize、close，以及包含 shell、enhancement、reason、rows、cols 的 started 状态。
        '400':
          description: 终端目标或握手参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 终端通道未启用
        '503':
          description: AUTH_STREAM_UNAVAILABLE 或 AUTH_STREAM_LIMIT_REACHED 表示实时认证能力不可用或服务租约额度已满；也可能是 Root Agent 终端能力不可用。升级后错误使用 WebSocket 稳定 code，不追加 HTTP JSON 错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: AUTH_UNAUTHORIZED；Root 会话不存在、已撤销、已到期或账号已禁用；在流建立前拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  responses:
    AuthRateLimited:
      description: AUTH_RATE_LIMITED（含 requestId）。同一 handler 的 login/bootstrap 共用突发 10 次、每 5 秒补充 1 次、最多 2 个在途凭据请求的预算；bootstrap 创建与随后登录共占一次。拒绝发生在认证调用前，不设置或清除 Cookie。预算按 handler 隔离并在重启时重置，不按账号或转发头分组；持续攻击仍可能影响正常登录。不自动重放凭据，请稍后手动重试。
      headers:
        Retry-After:
          description: 建议等待的整数秒，向上取整且至少 1 秒；不保证届时准入。
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RequestBodyTooLarge:
      description: 完整 JSON 请求体超过该操作的字节上限；稳定错误码 HTTP_REQUEST_BODY_TOO_LARGE，包含 requestId。仅在通过原有来源、认证、依赖、参数及 MIME 前置校验后检查实际请求体，不依赖 Content-Length；不会执行后续业务操作。不返回请求体或底层读取错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: HTTP_REQUEST_BODY_TOO_LARGE
            message: 请求体超过大小限制。
            requestId: req-body-limit
    UnsupportedMediaType:
      description: JSON 请求必须使用单一 application/json Content-Type（允许有效 MIME 参数）；错误码 HTTP_UNSUPPORTED_MEDIA_TYPE，包含 requestId。可选请求体仅在实际非空时要求该类型。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DatabaseResultTooLarge:
      description: >-
        数据库结果超过 1 MiB（1048576 字节）的保守结果保留预算，或最终 JSON/protobuf 编码响应超过该上限；稳定错误码 result_too_large。
        数据库目录、元数据或完整表页过大时返回此错误，不将其误报为 Agent 断连，也不返回被静默缩短的表页。
        SQL 可能已经执行或写入；此错误不保证未执行或回滚，不得自动重试 SQL，应先核对实际数据库状态。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CrossOriginRejected:
      description: 浏览器写请求的来源校验失败；命令行可省略 Origin，仍需原有会话认证。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: HTTP_CROSS_ORIGIN_REJECTED
            message: 请求来源校验失败，请从当前控制台页面重试。
            requestId: req-origin
  schemas:
    UserPreferences:
      type: object
      required: [refreshIntervalSeconds, interfaceDensity, baseFontSize, pageSize, sidebarDefault, linkOpenMode, siteDefaultProtocol, chineseFont, latinFont, navigationOrder]
      properties:
        refreshIntervalSeconds:
          type: integer
          minimum: 2
          maximum: 300
          default: 5
        interfaceDensity:
          type: string
          enum: [comfortable, compact]
        baseFontSize:
          type: integer
          minimum: 13
          maximum: 18
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        sidebarDefault:
          type: string
          enum: [collapsed, expanded]
        linkOpenMode:
          type: string
          enum: [new-tab, same-tab]
        siteDefaultProtocol:
          type: string
          enum: [http, https]
        chineseFont:
          type: string
          enum: [system, noto-sans-sc, microsoft-yahei, source-han-sans-sc, misans, harmonyos-sans-sc]
        latinFont:
          type: string
          enum: [system, manrope, inter, ibm-plex-sans]
        navigationOrder:
          type: array
          description: 使用稳定路由 ID 保存的侧栏顺序；服务端会合并新增路由并清理已删除路由。
          uniqueItems: true
          items:
            type: string
            enum: [overview, sites, docker, databases, logs, monitoring, system, users, terminal, settings]
    DatabaseProjectPreference:
      type: object
      required: [projectKey, archived]
      properties:
        projectKey:
          type: string
          minLength: 1
          maxLength: 512
        archived:
          type: boolean
    DatabaseDriver:
      type: string
      enum: [sqlite, mysql, postgresql]
    DatabaseTLSPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      description: 仅支持 MySQL/PostgreSQL 的证书链及服务器身份校验；SQLite 不支持 TLS 策略。每次连接必须严格执行，不提供跳过校验、明文或旧 Agent 回退。输入或连接诊断不构成已应用 TLS 的证明。
      properties:
        mode:
          type: string
          enum: [verify-full]
        caPEM:
          type: string
          description: 可省略或为空字符串，表示使用 Root Agent 系统根证书；非空时仅信任这些 PEM CA，不合并系统根。必须为非 null 字符串，UTF-8 编码最多 65536 字节（64 KiB），最多 32 张 CERTIFICATE；包括所有空白，不按字符数计算。证书 DER、CA 与签发用途由服务端权威校验；不得包含私钥、未知块或非 PEM 内容。
        serverName:
          type: string
          maxLength: 253
          description: 可省略或为空字符串，默认验证实际连接目标的主机身份；非空值仅改变证书验证身份与 SNI，不改变连接目标。必须为非 null 字符串；原始输入最多 253 个 ASCII 字节，每个 DNS 标签最多 63 字节，支持 ASCII DNS（允许单个尾点）或无方括号/zone 的原始 IP。不 trim、补全或修复非法身份。
    DatabaseCredentials:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, format: password, maxLength: 512 }
        token: { type: string, format: password, maxLength: 2048 }
        database: { type: string, maxLength: 256 }
        tls:
          $ref: '#/components/schemas/DatabaseTLSPolicy'
      description: 凭据仅在请求中短暂传递；服务端只保存加密密文，不返回 password、token 或 caPEM。仅设置 TLS 也属于手动请求，不自动取回已保存密码，仍按原有规则要求本次用户名和有效数据库，允许空密码。 credentials.tls 仅接受显式 verify-full 策略；出现 TLS 键时，sourceId、credentials 和凭据/策略字段必须使用唯一、规范拼写。null、空策略、未知字段、重复对象或键、大小写及 Unicode 折叠别名、非字符串策略值均在发现来源或调用凭据服务/Agent 前以 400 DATABASE_INPUT_INVALID 拒绝。省略 tls 会继承已保存的严格策略，不表示关闭；没有已保存策略时保留既有连接行为。严格策略失败或旧 Agent 不支持时不移除 TLS，也不回退重试。
    DatabaseConnection:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 512 }
        credentials:
          $ref: '#/components/schemas/DatabaseCredentials'
    DatabaseConnectRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseConnection'
    DatabaseSource:
      type: object
      required: [id, name, driver, category, project, module, location, requiresLogin, status, reachability, evidence, tags]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { $ref: '#/components/schemas/DatabaseDriver' }
        category: { type: string, enum: [system, project] }
        project: { type: string }
        module: { type: string }
        location: { type: string }
        path: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        defaultDatabase: { type: string }
        requiresLogin: { type: boolean }
        status: { type: string }
        reachability: { type: string, enum: [host, container-internal, unreachable] }
        evidence: { type: string, enum: [published-port, host-network, host-path, database-url, none] }
        tags: { type: array, items: { type: string } }
    DatabaseDiscovery:
      type: object
      required: [collectedAt, sources]
      properties:
        collectedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DatabaseSource' }
    DatabaseConnectionDiagnostic:
      type: object
      required: [connected, driver, endpoint, operation, durationMs]
      properties:
        connected: { type: boolean }
        code: { type: string, description: 稳定诊断码，例如 auth_failed、unreachable 或 constraint_failed }
        driver: { $ref: '#/components/schemas/DatabaseDriver' }
        endpoint: { type: string }
        database: { type: string }
        operation: { type: string }
        durationMs: { type: integer, minimum: 0 }
    DatabaseColumn:
      type: object
      required: [name, dataType, nullable, primaryKey, position, writeMode]
      properties:
        name: { type: string }
        dataType: { type: string }
        nullable: { type: boolean }
        primaryKey: { type: boolean }
        default: {}
        position: { type: integer, minimum: 0 }
        writeMode: { type: string, enum: [required, optional-default, server-generated] }
    DatabaseTable:
      type: object
      required: [schema, name, type, columns]
      properties:
        schema: { type: string }
        name: { type: string }
        type: { type: string, enum: [table, view, virtual, unknown] }
        columns:
          type: array
          items: { $ref: '#/components/schemas/DatabaseColumn' }
        rowCount:
          type: integer
          format: int64
          description: 数据库引擎提供的行数或估计值；PostgreSQL 未统计时可能为 -1，不能将其解释为 0。
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string }
        definition: { type: string }
    DatabaseCatalog:
      type: object
      required: [source, tables]
      properties:
        source: { $ref: '#/components/schemas/DatabaseSource' }
        tables:
          type: array
          items: { $ref: '#/components/schemas/DatabaseTable' }
    DatabaseQueryRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseConnection'
        - type: object
          required: [sql]
          properties:
            sql:
              type: string
              minLength: 1
              maxLength: 1048576
              description: SQL 原文；不拆分、删除注释或重组后执行。
            resultMode:
              type: string
              enum: [auto, rows, exec]
              default: auto
              description: >-
                可选结果模式。省略字段沿用旧 Query 协议；空字符串或 null 也宽容地视为省略。
                规范客户端应仅省略或发送 auto、rows、exec。显式 auto、rows、exec 使用新 QueryWithOptions 协议，旧 Agent 在执行 SQL 前返回 result_mode_unsupported，不自动降级或重放。
                auto 跳过可识别的前导普通注释后按首关键字选择路径；新版 Agent 对 SQLite/PostgreSQL 完整识别的普通 WITH 主 INSERT/UPDATE/DELETE，且没有顶层裸 RETURNING 时选择执行路径。
                SQLite 直接 INSERT/UPDATE/DELETE 在完整有界扫描确认顶层 RETURNING 时选择返回行路径；PostgreSQL/MySQL 的直接 DML 与 REPLACE 不扩展。
                未覆盖词法、复杂 WITH、多语句或扫描超限保留原有路径，不拒绝 SQL；其他 RETURNING 应显式选择 rows。原 SQL 只执行一次，失败不换路重放。
                rows 调用返回行路径，适用于写语句 RETURNING，但仍会执行写入；exec 调用执行路径，获取驱动影响行数并丢弃可能的返回行，适用于无返回行的 CTE 写语句。
                其他非空值（含大小写变体或前后空格）在准备数据库连接前返回 sql_invalid。
    DatabaseQueryResult:
      type: object
      description: >-
        返回预算内的完整行前缀，保留大整数与高精度小数字符串原文。
        行数或字节截断只影响结果展示，不能推断匹配总数、写入行数或回滚状态。
      required: [columns, rows, rowsAffected, truncated, durationMs]
      properties:
        columns: { type: array, items: { type: string } }
        rows:
          type: array
          items: { type: array, items: {} }
        rowsAffected:
          type: integer
          format: int64
          description: 仅 rowsAffectedKnown 为 true 时是可信的驱动报告计数；新 Agent 在未知时保留 0 占位。未知值不可解读为实际影响行数，驱动计数也不保证涵盖触发器等全部变化。
        rowsAffectedKnown:
          type: boolean
          description: >-
            新 Agent 始终返回此字段。仅 true 允许显示影响行数；false 或旧 Agent 缺失此字段均表示未知，不得根据 rowsAffected 非零推断可信。
            返回行路径始终未知；执行路径在计数不支持、出错、为负或超过 JavaScript 安全整数范围时也未知，但 SQL 本身仍可执行成功。
        truncated:
          type: boolean
          description: 表示结果因 500 行上限或 1 MiB 保守字节预算只保留完整行前缀；不限制或推断数据库写入行数。旧 Agent 可省略 truncationReason，调用方应保留通用截断提示。
        truncationReason:
          type: string
          enum: [row_limit, byte_limit]
          description: >-
            可选截断原因，仅 truncated=true 时提供。row_limit 表示达到 500 行展示上限，byte_limit 表示下一完整行无法放入 1 MiB 保守结果预算。
            byte_limit 可以伴随空 rows，但不代表查询无匹配或写入未生效；返回行路径的 rowsAffectedKnown 仍为 false。
        durationMs: { type: integer, minimum: 0 }
    DatabaseRowsRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseConnection'
        - type: object
          required: [table]
          properties:
            schema: { type: string, maxLength: 256 }
            table: { type: string, minLength: 1, maxLength: 256 }
            limit: { type: integer, minimum: 1, maximum: 200 }
            offset: { type: integer, minimum: 0 }
            sortColumn: { type: string, maxLength: 256 }
            sortDirection: { type: string, enum: [asc, desc] }
    DatabaseRowsResult:
      type: object
      description: 成功页不会按字节预算缩短或裁剪值；整页或元数据超预算返回 HTTP 422 result_too_large，客户端不得当作空页或推进 offset。
      required: [table, rows, limit, offset, hasMore, ordering]
      properties:
        table: { $ref: '#/components/schemas/DatabaseTable' }
        rows:
          type: array
          items: { type: object, additionalProperties: {} }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        ordering:
          type: object
          required: [stable, columns]
          properties:
            stable: { type: boolean }
            columns: { type: array, items: { type: string } }
    DatabaseInsertRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseConnection'
        - type: object
          required: [table, values]
          properties:
            schema: { type: string }
            table: { type: string, minLength: 1 }
            values:
              type: object
              additionalProperties: {}
              description: 整数与高精度小数建议使用字符串；values/keys 中直接作为字段值的原始 JSON 数字会按数字文本精确保留并传给数据库。嵌套对象或数组不在此保证内，JSON 列内容应预先序列化为字符串。无法恢复客户端在生成 JSON 前已发生的浮点舍入；最终存储精度由数据库字段类型决定。
    DatabaseUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseInsertRequest'
        - type: object
          required: [keys]
          properties:
            keys:
              type: object
              additionalProperties: {}
              description: 整数与高精度小数建议使用字符串；values/keys 中直接作为字段值的原始 JSON 数字会按数字文本精确保留并传给数据库。嵌套对象或数组不在此保证内，JSON 列内容应预先序列化为字符串。无法恢复客户端在生成 JSON 前已发生的浮点舍入；最终存储精度由数据库字段类型决定。
    DatabaseDeleteRequest:
      allOf:
        - $ref: '#/components/schemas/DatabaseConnection'
        - type: object
          required: [table, keys]
          properties:
            schema: { type: string }
            table: { type: string, minLength: 1 }
            keys:
              type: object
              additionalProperties: {}
              description: 整数与高精度小数建议使用字符串；values/keys 中直接作为字段值的原始 JSON 数字会按数字文本精确保留并传给数据库。嵌套对象或数组不在此保证内，JSON 列内容应预先序列化为字符串。无法恢复客户端在生成 JSON 前已发生的浮点舍入；最终存储精度由数据库字段类型决定。
    DatabaseMutationResult:
      type: object
      description: 有效驱动回执；零为合法计数，不证明目标行发生变化。回执无效时不返回成功，且不能据此重放写入。
      required: [rowsAffected]
      properties:
        rowsAffected: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
    ResourceAlertsSnapshot:
      type: object
      required: [enabled, observedAt, startedAt, rules]
      properties:
        enabled: {type: boolean}
        observedAt: {type: string, format: date-time, description: 响应投影时间，不刷新样本年龄。}
        startedAt: {type: string, format: date-time, description: 本次进程 evaluator 创建时间。}
        rules:
          type: object
          required: [cpu, memory]
          properties:
            cpu:
              allOf:
                - {$ref: '#/components/schemas/ResourceAlertRule'}
                - type: object
                  properties:
                    id: {type: string, enum: [host.cpu.high]}
                    recoveryPercent: {type: number, enum: [80]}
            memory:
              allOf:
                - {$ref: '#/components/schemas/ResourceAlertRule'}
                - type: object
                  properties:
                    id: {type: string, enum: [host.memory.high]}
                    recoveryPercent: {type: number, enum: [85]}
    ResourceAlertRule:
      type: object
      required: [id, severity, triggerPercent, recoveryPercent, triggerSeconds, recoverySeconds, condition, availability, reasonCode, sampleAt, receivedAt, value, pendingSince, firingSince, recoveringSince, lastRecoveredAt]
      properties:
        id: {type: string, enum: [host.cpu.high, host.memory.high]}
        severity: {type: string, enum: [warning]}
        triggerPercent: {type: number, enum: [90]}
        recoveryPercent: {type: number, enum: [80, 85], description: CPU 为 80，内存为 85。}
        triggerSeconds: {type: integer, enum: [120]}
        recoverySeconds: {type: integer, enum: [60]}
        condition: {type: string, enum: [normal, pending, firing, recovering]}
        availability: {type: string, enum: [fresh, unknown, stale]}
        reasonCode:
          type: string
          enum: ['', MONITORING_ALERTS_NO_SAMPLE, MONITORING_ALERTS_CLOCK_INVALID, SYSTEM_SUMMARY_UNAVAILABLE, MONITORING_INVALID_TIMESTAMP, MONITORING_SAMPLE_INVALID, MONITORING_SAMPLE_LIMIT_EXCEEDED, MONITORING_ALERTS_CPU_UNAVAILABLE, MONITORING_ALERTS_MEMORY_UNAVAILABLE, MONITORING_ALERTS_CPU_INVALID, MONITORING_ALERTS_MEMORY_INVALID, MONITORING_ALERTS_STALE]
        sampleAt: {type: [string, 'null'], format: date-time}
        receivedAt: {type: [string, 'null'], format: date-time}
        value: {type: [number, 'null'], minimum: 0, maximum: 100, description: 最近合格百分比，数据不可用时仅代表上次有效值。}
        pendingSince: {type: [string, 'null'], format: date-time}
        firingSince: {type: [string, 'null'], format: date-time}
        recoveringSince: {type: [string, 'null'], format: date-time}
        lastRecoveredAt: {type: [string, 'null'], format: date-time}
    MetricSample:
      type: object
      required: [collectedAt, cpuPercent, memoryPercent, load1, diskPercent, networkReceiveBytes, networkTransmitBytes, diskReadBytes, diskWriteBytes]
      properties:
        collectedAt: { type: string, format: date-time }
        cpuPercent: { type: number, format: double }
        memoryPercent: { type: number, format: double }
        load1: { type: number, format: double }
        diskPercent: { type: number, format: double }
        networkReceiveBytes: { type: integer, format: int64 }
        networkTransmitBytes: { type: integer, format: int64 }
        diskReadBytes: { type: integer, format: int64, minimum: 0 }
        diskWriteBytes: { type: integer, format: int64, minimum: 0 }
        temperatures:
          type: array
          items:
            type: object
            required: [name, temperatureCelsius]
            properties:
              name: { type: string }
              temperatureCelsius: { type: number, format: double }
    SiteProfileInput:
      type: object
      required: [name, description, iconUrl, category, launchUrl, primaryPort, favorite, sortOrder, hidden]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        iconUrl:
          type: string
          maxLength: 2048
        category:
          type: string
          maxLength: 64
        launchUrl:
          type: string
          maxLength: 2048
        primaryPort:
          type: integer
          minimum: 0
          maximum: 65535
        favorite:
          type: boolean
        sortOrder:
          type: integer
          minimum: -100000
          maximum: 100000
        hidden:
          type: boolean
    SiteProfileResponse:
      type: object
      description: >-
        保存的站点资料，与写入输入分离。projectId 是服务端返回的真实身份；
        手工创建时为 manual: 前缀的 ID，更新时为目标 ID。
        ignored 列表可以包含尚未编辑的占位资料，此时 name 合法地为空字符串。
        source、ignored、lastVisitedAt 与探测及图标元数据在当前服务端返回，
        为兼容旧响应保持可选；允许未知附加字段。此响应不继承输入的长度或排序范围限制。
      required: [projectId, name, description, iconUrl, category, launchUrl, primaryPort, favorite, sortOrder, hidden]
      properties:
        projectId: { type: string, minLength: 1 }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: string }
        category: { type: string }
        launchUrl: { type: string }
        primaryPort: { type: integer, minimum: 0, maximum: 65535 }
        favorite: { type: boolean }
        sortOrder: { type: integer }
        hidden: { type: boolean }
        source:
          type: string
          enum: [auto, labels, built-in, edited, manual]
        ignored: { type: boolean }
        detectedTitle: { type: string }
        autoIconUrl: { type: string }
        localIconName: { type: string, readOnly: true, description: 由图标上传与删除接口维护的服务端文件名 }
        lastVisitedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    Site:
      allOf:
        - $ref: '#/components/schemas/SiteProfileInput'
        - type: object
          required: [id, projectId, state, ports, source, lastVisitedAt]
          properties:
            id: { type: string }
            projectId: { type: string }
            state: { type: string }
            ports:
              type: array
              items: { type: integer, minimum: 1, maximum: 65535 }
            source:
              type: string
              enum: [auto, labels, built-in, edited, manual]
            lastVisitedAt:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
    SiteListResponse:
      type: object
      required: [collectedAt, sites, discovery]
      properties:
        collectedAt:
          type: string
          format: date-time
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        discovery:
          $ref: '#/components/schemas/SiteDiscoverySummary'
    SiteDiscoverySummary:
      type: object
      required: [status, probeAvailable, candidateCount, verifiedCount, failedCount, issues]
      properties:
        status:
          type: string
          enum: [complete, partial, unavailable]
        probeAvailable: { type: boolean }
        candidateCount: { type: integer, minimum: 0 }
        verifiedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SiteDiscoveryIssue'
    SiteDiscoveryIssue:
      type: object
      required: [siteId, projectId, name, ports, reason]
      properties:
        siteId: { type: string }
        projectId: { type: string }
        name: { type: string }
        ports:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
        reason: { type: string }
    SiteVisitResponse:
      type: object
      required: [siteId, lastVisitedAt]
      properties:
        siteId:
          type: string
        lastVisitedAt:
          type: string
          format: date-time
    CredentialsRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    PasswordPolicy:
      type: object
      required: [minLength, requireUppercase, requireLowercase, requireDigit, requireSpecial]
      properties:
        minLength: { type: integer, minimum: 1, maximum: 128, default: 6 }
        requireUppercase: { type: boolean, default: false }
        requireLowercase: { type: boolean, default: false }
        requireDigit: { type: boolean, default: false }
        requireSpecial: { type: boolean, default: false }
    Principal:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, minimum: 1 }
        username: { type: string }
        role:
          type: string
          enum: [root]
    ManagedUser:
      type: object
      required: [id, username, role, disabled, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1 }
        username: { type: string }
        role: { type: string, enum: [root] }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLoginAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    ListPreference:
      type: object
      required: [listKey, pageSize, sortKey, sortDirection]
      properties:
        listKey: { type: string }
        pageSize: { type: integer, minimum: 1, maximum: 200, default: 10 }
        sortKey: { type: string }
        sortDirection: { type: string, enum: [asc, desc] }
    AuthStatusResponse:
      type: object
      required: [initialized, authenticated]
      properties:
        initialized: { type: boolean }
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/Principal'
            - type: 'null'
    AuthSessionResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/Principal'
        expiresAt:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required: [status, service, checks]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        service: { type: string, const: ncp-server }
        checks:
          type: object
          required: [agent, docker]
          properties:
            jobs:
              type: string
              enum: [ready, degraded, unavailable]
              description: Job 引擎状态。结果等待持久化时为 degraded；初始化失败或已关闭时为 unavailable。非 ready 会使 /readyz 返回 503。
          additionalProperties:
            type: string
            enum: [ready, degraded, unavailable, not_checked]
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          examples: [ok]
        service:
          type: string
          examples: [ncp-server]
    AgentStatus:
      type: object
      required: [protocolVersion, buildVersion, agentEUID, transport]
      properties:
        protocolVersion:
          type: string
          examples: [p0-v1]
        buildVersion:
          type: string
          examples: [8ddb82a]
        agentEUID:
          type: integer
          minimum: 0
        transport:
          type: string
          examples: [unix]
    RealtimeSnapshot:
      type: object
      required: [collectedAt]
      properties:
        collectedAt:
          type: string
          format: date-time
          description: 本次事件发送时间，不可用于为内层资源保鲜
        summary:
          $ref: '#/components/schemas/SystemSummary'
        docker:
          $ref: '#/components/schemas/DockerInventory'
        errors:
          type: array
          description: >-
            各资源独立状态，客户端须检查全部错误。SYSTEM_SUMMARY_UNAVAILABLE 表示没有当前可用主机快照；
            MONITORING_WRITE_FAILED 表示历史写入失败，MONITORING_SAMPLE_INCOMPLETE 表示核心源 warning 导致历史候选不完整，
            MONITORING_SAMPLE_INVALID 表示历史值无效，MONITORING_SAMPLE_LIMIT_EXCEEDED 表示历史候选超限。
            四种历史错误均不等同于 Agent 不可用，也不取消有效 summary。
            源 warnings 保留在 summary.warnings 中；Docker 错误独立为 DOCKER_INVENTORY_UNAVAILABLE。
          items:
            type: string
            enum:
              - SYSTEM_SUMMARY_UNAVAILABLE
              - DOCKER_INVENTORY_UNAVAILABLE
              - MONITORING_WRITE_FAILED
              - MONITORING_SAMPLE_INCOMPLETE
              - MONITORING_SAMPLE_INVALID
              - MONITORING_SAMPLE_LIMIT_EXCEEDED
    SystemSummary:
      type: object
      required: [collectedAt, host, cpu, memory, storage, network, warnings]
      properties:
        collectedAt:
          type: string
          format: date-time
        host:
          $ref: '#/components/schemas/HostSnapshot'
        cpu:
          $ref: '#/components/schemas/CpuStats'
        memory:
          $ref: '#/components/schemas/MemoryStats'
        sensors:
          type: array
          items:
            type: object
            required: [name, temperatureCelsius]
            properties:
              name: { type: string }
              temperatureCelsius: { type: number, format: double }
        diskIO:
          type: object
          required: [readBytes, writeBytes]
          properties:
            readBytes: { type: integer, format: int64, minimum: 0 }
            writeBytes: { type: integer, format: int64, minimum: 0 }
        storage:
          type: array
          items:
            $ref: '#/components/schemas/DiskStats'
        network:
          type: array
          items:
            $ref: '#/components/schemas/NetworkStats'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SummaryWarning'
    HostSnapshot:
      type: object
      properties:
        hostname: { type: string }
        operatingSystem: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        processCount: { type: integer, minimum: 0 }
    CpuStats:
      type: object
      properties:
        usagePercent: { type: number, minimum: 0 }
        logicalCores: { type: integer, minimum: 0 }
        load1: { type: number, minimum: 0 }
        load5: { type: number, minimum: 0 }
        load15: { type: number, minimum: 0 }
    MemoryStats:
      type: object
      properties:
        totalBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        availableBytes: { type: integer, minimum: 0 }
    DiskStats:
      type: object
      properties:
        mountpoint: { type: string }
        totalBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        freeBytes: { type: integer, minimum: 0 }
    NetworkStats:
      type: object
      properties:
        name: { type: string }
        receiveBytes: { type: integer, minimum: 0 }
        transmitBytes: { type: integer, minimum: 0 }
    SummaryWarning:
      type: object
      required: [code, source]
      properties:
        code: { type: string, examples: [SYSTEM_SUMMARY_SOURCE_UNAVAILABLE] }
        source: { type: string }
    SystemDetails:
      type: object
      required: [collectedAt, warnings, device, hardware, network, storage, proxy, control]
      properties:
        collectedAt: { type: string, format: date-time }
        warnings: { type: array, items: { type: string } }
        device: { $ref: '#/components/schemas/SystemDeviceDetails' }
        hardware: { $ref: '#/components/schemas/SystemHardwareDetails' }
        network: { $ref: '#/components/schemas/SystemNetworkDetails' }
        storage: { $ref: '#/components/schemas/SystemStorageDetails' }
        proxy: { $ref: '#/components/schemas/SystemProxyDetails' }
        tailscale: { $ref: '#/components/schemas/SystemDetailsTailscaleCapability' }
        dns: { $ref: '#/components/schemas/SystemDetailsDNSCapability' }
        publicEgress: { $ref: '#/components/schemas/PublicEgressCapability' }
        control: { $ref: '#/components/schemas/SystemControlDetails' }
    SystemDeviceDetails:
      type: object
      required: [hostname, model, operatingSystem, kernelVersion, architecture, uptimeSeconds, processCount, cgroupVersion]
      properties:
        hostname: { type: string }
        model: { type: string }
        operatingSystem: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        processCount: { type: integer, minimum: 0 }
        cgroupVersion: { type: string }
    SystemHardwareDetails:
      type: object
      required: [cpu, memory, sensors]
      properties:
        cpu:
          type: object
          required: [model, physicalCores, logicalCores, frequencyMHz, temperatureCelsius]
          properties:
            model: { type: string }
            physicalCores: { type: integer, minimum: 0 }
            logicalCores: { type: integer, minimum: 0 }
            frequencyMHz: { type: number, minimum: 0 }
            temperatureCelsius: { type: number }
        memory:
          type: object
          required: [totalBytes, availableBytes]
          properties:
            totalBytes: { type: integer, minimum: 0 }
            availableBytes: { type: integer, minimum: 0 }
        sensors:
          type: array
          items:
            type: object
            required: [name, temperatureCelsius]
            properties:
              name: { type: string }
              temperatureCelsius: { type: number }
    SystemNetworkDetails:
      type: object
      required: [interfaces, gateway, routes, dnsServers, listeningPorts]
      properties:
        interfaces:
          type: array
          items:
            type: object
            required: [name, hardwareAddress, mtu, state, lowerUp, lowerUpKnown, speedMbps, duplex, addresses]
            properties:
              name: { type: string }
              hardwareAddress: { type: string }
              mtu: { type: integer, minimum: 0 }
              state: { type: string }
              lowerUp: { type: boolean }
              lowerUpKnown: { type: boolean }
              speedMbps: { type: integer, minimum: -1 }
              duplex: { type: string }
              addresses:
                type: [array, 'null']
                items:
                  type: object
                  required: [address, prefixLength, family]
                  properties:
                    address: { type: string }
                    prefixLength: { type: integer, minimum: 0 }
                    family: { type: string }
        gateway: { type: string }
        routes:
          type: array
          items:
            type: object
            required: [destination, gateway, interface, metric]
            properties:
              destination: { type: string }
              gateway: { type: string }
              interface: { type: string }
              metric: { type: integer }
        dnsServers: { type: array, items: { type: string } }
        listeningPorts:
          type: array
          items:
            type: object
            required: [protocol, address, port, pid]
            properties:
              protocol: { type: string }
              address: { type: string }
              port: { type: integer, minimum: 0, maximum: 65535 }
              pid: { type: integer }
              processName: { type: string }
              executable: { type: string }
              systemdUnit: { type: string }
              containerId: { type: string }
              containerName: { type: string }
              service: { type: string }
              detectionSource: { type: string }
              detectionSources: { type: [array, 'null'], items: { type: string } }
              detectionStatus: { type: string }
              detectionErrorCode: { type: string }
    SystemStorageDetails:
      type: object
      required: [mounts, disks, raid]
      properties:
        mounts:
          type: array
          items:
            type: object
            required: [path, device, filesystem, totalBytes, usedBytes, availableBytes, usedPercent]
            properties:
              path: { type: string }
              device: { type: string }
              filesystem: { type: string }
              totalBytes: { type: integer, minimum: 0 }
              usedBytes: { type: integer, minimum: 0 }
              availableBytes: { type: integer, minimum: 0 }
              usedPercent: { type: number, minimum: 0 }
        disks:
          type: array
          items:
            type: object
            required: [name, model, sizeBytes, rotational, kind, role, transport, description, health, temperatureCelsius]
            properties:
              name: { type: string }
              model: { type: string }
              sizeBytes: { type: integer, minimum: 0 }
              rotational: { type: boolean }
              kind: { type: string, enum: ['', physical, emmc, emmc-boot, compressed-memory, virtual] }
              role: { type: string, enum: ['', data, system, boot, swap, virtual] }
              transport: { type: string }
              description: { type: string }
              health: { type: string }
              temperatureCelsius: { type: number }
        raid:
          type: array
          items:
            type: object
            required: [name, level, state, devices]
            properties:
              name: { type: string }
              level: { type: string }
              state: { type: string }
              devices: { type: [array, 'null'], items: { type: string } }
    SystemProxyDetails:
      type: object
      required: [mihomo, system, associations]
      properties:
        mihomo:
          type: object
          required: [detected, state, detail]
          properties:
            detected: { type: boolean }
            state: { type: string }
            detail: { type: string }
            controllerEndpoint: { type: string }
            authRequired: { type: boolean }
            operations: { type: [array, 'null'], items: { type: string } }
        mihomoCapability: { $ref: '#/components/schemas/SystemDetailsMihomoCapability' }
        system:
          type: array
          items: { $ref: '#/components/schemas/SystemDetailsProxyEvidence' }
        associations:
          type: array
          items:
            type: object
            required: [subject, kind, method, evidence, endpoint, detail]
            properties:
              subject: { type: string }
              kind: { type: string }
              method: { type: string, enum: [http, socks, tun, transparent, unknown] }
              evidence: { type: string, enum: [confirmed, inferred, unknown] }
              endpoint: { type: string }
              detail: { type: string }
    ProxyEvidence:
      type: object
      properties:
        source: { type: string }
        method: { type: string, enum: [http, socks, tun, transparent, unknown] }
        evidence: { type: string, enum: [confirmed, inferred, unknown] }
        address: { type: string }
        detail: { type: string }
    SystemControlDetails:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, name, detail, status, version, lastSeen]
            properties:
              id: { type: string }
              name: { type: string }
              detail: { type: string }
              status: { type: string }
              version: { type: string }
              lastSeen: { type: string, format: date-time }
    SystemDetailsTailscaleCapability:
      type: object
      required:
      - detected
      - state
      - backendState
      - version
      - interface
      - overlayIps
      - online
      - linkState
      - heartbeatState
      - reachable
      - evidence
      - warnings
      properties:
        detected:
          type: boolean
        state:
          type: string
        backendState:
          type: string
        version:
          type: string
        interface:
          type: string
        overlayIps:
          type:
          - array
          - 'null'
          items:
            type: string
        online:
          type: boolean
        linkState:
          type: string
        heartbeatState:
          type: string
        reachable:
          type: boolean
        evidence:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CapabilityEvidence'
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SystemDetailsProbeWarning'
      description: 系统详情专用契约；嵌套 Go nil 切片在浏览器中规范化为空数组。
    SystemDetailsMihomoCapability:
      type: object
      required:
      - detected
      - state
      - processName
      - executable
      - version
      - controller
      - evidence
      - warnings
      properties:
        detected:
          type: boolean
        state:
          type: string
        processName:
          type: string
        executable:
          type: string
        version:
          type: string
        controller:
          $ref: '#/components/schemas/SystemDetailsMihomoControllerCapability'
        evidence:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CapabilityEvidence'
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SystemDetailsProbeWarning'
      description: 系统详情专用契约；嵌套 Go nil 切片在浏览器中规范化为空数组。
    SystemDetailsMihomoControllerCapability:
      type: object
      required:
      - detected
      - endpoint
      - reachable
      - authRequired
      - tokenConfigured
      - operations
      - detectionSource
      properties:
        detected:
          type: boolean
        endpoint:
          type: string
          description: 已脱敏的控制器地址
        reachable:
          type: boolean
        authRequired:
          type: boolean
        tokenConfigured:
          type: boolean
        operations:
          type:
          - array
          - 'null'
          items:
            type: string
        detectionSource:
          type: string
      description: 系统详情专用契约；嵌套 Go nil 切片在浏览器中规范化为空数组。
    SystemDetailsDNSCapability:
      type: object
      required:
      - backend
      - detected
      - state
      - readOnly
      - canRead
      - canPreview
      - canConfirm
      - canRollback
      - nameservers
      - detectionSource
      - errorCode
      properties:
        backend:
          type: string
          enum:
          - ''
          - systemd-resolved
          - networkmanager
          - static-resolv-conf
          - ugos-network-service
          - unknown
        detected:
          type: boolean
        state:
          type: string
        readOnly:
          type: boolean
        canRead:
          type: boolean
        canPreview:
          type: boolean
        canConfirm:
          type: boolean
        canRollback:
          type: boolean
        nameservers:
          type:
          - array
          - 'null'
          items:
            type: string
        configuredNameservers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: DNS servers managed by the detected writable backend; may differ from effective resolvers.
        detectionSource:
          type: string
        errorCode:
          type: string
      description: 系统详情专用契约；嵌套 Go nil 切片在浏览器中规范化为空数组。
    SystemDetailsProxyEvidence:
      type: object
      properties:
        source:
          type: string
        method:
          type: string
          enum:
          - ''
          - http
          - socks
          - tun
          - transparent
          - unknown
        evidence:
          type: string
          enum:
          - ''
          - confirmed
          - inferred
          - unknown
        address:
          type: string
        detail:
          type: string
      required:
      - source
      - method
      - evidence
      - address
      - detail
      description: 系统详情中的完整代理证据。
    SystemDetailsProbeWarning:
      type: object
      required: [code, source]
      properties:
        code: { type: string }
        source: { type: string }
    DockerInventory:
      type: object
      required: [collectedAt, engine, containers, projects]
      description: 浏览器逐项校验完整清单；必需字段缺失或元素无效时拒绝整个 Docker 清单。集合显式为 null 时按各字段说明归一化为空数组。
      properties:
        collectedAt:
          type: string
          format: date-time
        engine:
          $ref: '#/components/schemas/DockerEngineInfo'
        containers:
          type: [array, 'null']
          description: 必须提供；兼容 Go nil slice 的显式 null，浏览器归一化为 []，缺失字段不接受。
          items:
            $ref: '#/components/schemas/InventoryContainer'
        projects:
          type: [array, 'null']
          description: 必须提供；兼容 Go nil slice 的显式 null，浏览器归一化为 []，缺失字段不接受。
          items:
            $ref: '#/components/schemas/DockerProject'
    DockerResources:
      type: object
      required: [collectedAt, networks, volumes]
      properties:
        collectedAt: { type: string, format: date-time }
        networks:
          type: array
          items:
            $ref: '#/components/schemas/DockerNetworkResource'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/DockerVolumeResource'
    DockerNetworkResource:
      type: object
      required: [id, name, driver, scope, internal, subnets, gateways]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string }
        scope: { type: string }
        internal: { type: boolean }
        subnets: { type: array, items: { type: string } }
        gateways: { type: array, items: { type: string } }
    DockerVolumeResource:
      type: object
      required: [name, driver, scope, mountpoint]
      properties:
        name: { type: string }
        driver: { type: string }
        scope: { type: string }
        mountpoint: { type: string }
    FileEntriesPage:
      type: object
      required: [path, parent, entries, collectedAt]
      properties:
        path: { type: string }
        parent: { type: string }
        nextCursor: { type: string }
        collectedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
    FileEntry:
      type: object
      required: [name, path, type, readable]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [directory, file, symlink, other] }
        readable:
          type: boolean
          description: 当前 Agent 身份的瞬时读取权限提示，供路径选择使用，不保证后续打开、读取或挂载成功。Linux 检查有效身份权限并跟随符号链接，不打开目录条目；特殊文件可能为 true，但不表示已经打开或可以立即读取。非 Linux 保留原有打开探测行为。
    DockerImageInventory:
      type: object
      required: [collectedAt, images]
      properties:
        collectedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/DockerImageSummary'
    DockerImageSummary:
      type: object
      required: [id, repoTags, repoDigests, sizeBytes, createdAt, containers]
      properties:
        id: { type: string }
        repoTags:
          type: array
          items: { type: string }
        repoDigests:
          type: array
          items: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        createdAt:
          type: string
          format: date-time
        containers: { type: integer }
    DockerImagePullRequest:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 512
          examples: [nginx:alpine]
    DockerImagePullResult:
      type: object
      required: [reference, completed]
      properties:
        reference: { type: string }
        completed: { type: boolean }
    JobHistoryPage:
      type: object
      additionalProperties: false
      required: [source, items]
      properties:
        source: { type: string, enum: [persisted] }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/JobHistoryEntry' }
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: 只有读取到额外记录时存在，锚点是最后一条已返回记录；不保证下一页仍有记录。
    JobHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, type, status, message, createdAt, updatedAt]
      description: |
        最后一次成功保存的摘要，不提供取消、重试、删除或产物证据。
        字符串上限按 UTF-8 字节另行校验；超限或非法 UTF-8 使整页明确失败，不截断。
        status/type 为开放字符串，保留未来类型与状态；queued/running 不证明任务仍在执行。
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        type: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, minLength: 1, maxLength: 64 }
        reference: { type: string, maxLength: 4096 }
        message: { type: string, maxLength: 8192 }
        error: { type: string, maxLength: 8192 }
        errorCode: { type: string, maxLength: 128 }
        cancellationStatus: { type: string, maxLength: 64 }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 已保存记录的更新时间，不是当前采样或响应时间。
        completedAt: { type: string, format: date-time }
    DockerProjectActionJobResult:
      type: object
      additionalProperties: false
      required: [projectId, kind, action, items]
      description: 仅持久终态的安全回执；不含名称、原始错误或配置。items 按冻结请求顺序排列，ID不重复。completed要求全部succeeded；failed结果要求至少一个state-mismatch且无unknown；interrupted结果要求至少一个unknown。无可信回执时省略整个字段。
      properties:
        projectId: { type: string, enum: [standalone] }
        kind: { type: string, enum: [standalone] }
        action: { type: string, enum: [start, stop, restart] }
        items:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [containerId, outcome, state]
            description: succeeded 的 state 为动作目标且无errorCode；state-mismatch为明确反态和DOCKER_CONTAINER_STATE_MISMATCH；unknown固定unknown状态和JOB_EXECUTION_INTERRUPTED，不将读回状态误报为执行成功。
            properties:
              containerId: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
              outcome: { type: string, enum: [succeeded, state-mismatch, unknown] }
              state: { type: string, enum: [running, stopped, unknown] }
              errorCode: { type: string, enum: [DOCKER_CONTAINER_STATE_MISMATCH, JOB_EXECUTION_INTERRUPTED] }
    DockerContainerCreateJobResult:
      type: object
      additionalProperties: false
      required: [containerId, created, started]
      description: 最小化创建回执，不包含请求配置或实时运行状态；started 仅表示本次启动调用已确认，不保证持续运行。
      properties:
        containerId:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[a-f0-9]{64}$'
        created: { type: boolean, enum: [true] }
        started: { type: boolean }
    JobSnapshot:
      type: object
      allOf:
        - oneOf:
            - not: { required: [projectActionResult] }
            - required: [projectActionResult]
              properties:
                type: { type: string, enum: [docker-project-start, docker-project-stop, docker-project-restart] }
                reference: { type: string, enum: [standalone] }
                status: { type: string, enum: [completed, failed, interrupted] }
      oneOf:
        - not:
            required: [createResult]
        - required: [createResult]
          properties:
            type: { type: string, enum: [docker-container-create] }
            status: { type: string, enum: [completed] }
      required: [id, type, status, artifactState, message, progress, createdAt, updatedAt]
      properties:
        projectActionResult:
          description: 仅三个独立容器项目生命周期类型的已持久终态详情或 SSE 中出现；历史摘要不包含结果。结果待保存时不外露。
          allOf:
            - $ref: '#/components/schemas/DockerProjectActionJobResult'
        createResult:
          description: 可选的最小化创建回执，仅在 completed 的 docker-container-create 任务详情或 SSE 快照中出现；历史列表摘要不包含此字段。
          allOf:
            - $ref: '#/components/schemas/DockerContainerCreateJobResult'
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, interrupted, cancelled] }
        cancellationStatus:
          type: string
          enum: [requested, confirmed, unknown]
          description: 可选取消证据。requested 仅表示已接收；confirmed 表示执行器确认停止或排队时未执行；unknown 表示远端结果未确认。取消不能撤销已有副作用。
        persistenceStatus:
          type: string
          enum: [pending]
          description: 任务结果待持久化，包括未开始任务的排队超时结果。status 保持最后已提交的活动状态，继续订阅 SSE；禁止删除或重新执行，尚未确认最终结果。
        cancellable:
          type: boolean
          description: 执行器是否支持取消；Compose、docker-image-remove、docker-container-create 、docker-project-start/stop/restart 与 docker-container-start/stop/restart 为 false。实际操作仍由服务端状态校验决定。
        errorCode:
          type: string
          description: 稳定错误码。JOB_QUEUE_TIMEOUT 表示从容量预留起排队达到 10 分钟且尚未获得执行资格，持久化后为 failed，消息为“排队等待超时，任务未开始执行”；适用于镜像拉取、Compose 部署、镜像删除、容器创建与单容器生命周期任务（docker-container-start/stop/restart），包含创建记录耗时。running 写入后仍会复查期限，获得执行资格者不受排队 TTL 影响。另有 JOB_EXECUTION_TIMEOUT 或 JOB_HISTORY_CORRUPT（历史进度损坏）；调用方不应解析错误文本。
        completedAt:
          type: string
          format: date-time
          description: 持久化终态的完成时间；活动任务及结果待保存时省略。
        artifactState: { type: string, enum: [present, deleted, unknown] }
        reference: { type: string }
        message: { type: string }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 进度观测值，不是执行完成证据。progressLimited 为 true 时可能只覆盖部分层，不应展示为完整任务百分比；执行完成仅由可信最终回执确认。
        progressLimited:
          type: boolean
          description: |
            可选的单调受限标记；一旦为 true，同一任务的后续快照、取消、待保存和终态继续保留 true。
            true 表示层或状态进度遥测曾触及资源限制，字节数、总量和速度均可能只覆盖部分层；不改变执行生命周期或产物结论。
            省略或 false 仅表示没有记录到资源限制，不保证进度完整；不能根据此标记或层进度推断任务已完成。
        downloadedBytes: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        speedBytes: { type: integer, minimum: 0 }
        layers:
          type: object
          description: |
            新接纳的镜像拉取进度最多保留 128 层，按每层 2 × ID 的 UTF-8 字节数 + 256 字节预留字符串容量，总预算 32 KiB。
            ID 超过 128 UTF-8 字节时拒绝该层，不截断身份；状态超过 256 UTF-8 字节时在字符边界安全截断。
            因层数、字符串预算或 ID 限制拒绝新层，或状态被截断时设置 progressLimited；已接纳层仍可更新，裁剪进度不会结束执行。
            限制适用于新接纳的进度；旧持久化快照保持可读，不对此字段追加全局数量或字符串 schema 限制。
          additionalProperties: true
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DockerImageRemoveJobRequest:
      type: object
      required: [imageId]
      properties:
        imageId:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          minLength: 71
          maxLength: 71
          description: 清单中的完整内容身份，不接受标签、短 ID 或空白。
    DockerImageRemoveRequest:
      type: object
      required: [imageId]
      properties:
        imageId:
          type: string
          minLength: 1
          maxLength: 512
    DockerImageRemoveBatchRequest:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 512 }
    DockerImageRemoveBatchItem:
      type: object
      required: [imageId, removed]
      properties:
        imageId: { type: string }
        removed: { type: boolean }
        errorCode: { type: string, description: DOCKER_IMAGE_IN_USE 等稳定错误码 }
    DockerImageRemoveBatchResult:
      type: object
      required: [items, removedCount, failedCount, completed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DockerImageRemoveBatchItem' }
        removedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        completed: { type: boolean }
    DockerContainerMountInput:
      type: object
      required: [type, target]
      properties:
        type: { type: string, enum: [bind, volume, tmpfs] }
        source:
          type: string
          description: bind 使用绝对宿主机路径并原样保留名称中的空白；volume 使用卷名并去除首尾空白；tmpfs 不需要来源。
        target:
          type: string
          minLength: 1
          description: 容器内绝对目标路径，原样保留名称中的空白；前导空白不能替代绝对路径开头的斜线。
        readOnly: { type: boolean, default: false }
        volumeDriver: { type: string }
        tmpfsSizeBytes: { type: integer, minimum: 0 }
    DockerContainerNetworkInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        driver:
          type: string
          description: 提供 subnet 时用于创建或校验同名网络，省略时按 bridge 校验；不提供 subnet 时仅连接现有网络，不应用此字段。
        subnet:
          type: string
          description: 提供时仅在同名网络不存在时创建；已有网络必须具有相同驱动和此子网，否则创建容器失败，不修改现有网络。省略时仅按名称连接现有网络。
        gateway:
          type: string
          description: 必须同时提供 subnet；显式提供时，已有网络的匹配子网条目必须具有此网关。省略时允许复用已有网关，创建新网络时由 Docker 分配。
        ip: { type: string }
    DockerContainerPortInput:
      type: object
      required: [containerPort]
      properties:
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        hostPort: { type: integer, minimum: 0, maximum: 65535 }
        hostIp: { type: string }
        protocol: { type: string, enum: [tcp, udp, sctp], default: tcp }
    DockerContainerDeviceInput:
      type: object
      required: [hostPath, containerPath]
      properties:
        hostPath:
          type: string
          description: 主机设备的规范绝对路径；保留尾部空白，不做 trim。拒绝前导空白、点路径段、重复斜杠、NUL、CR、LF 和冒号。
        containerPath:
          type: string
          description: 容器设备的规范绝对路径；保留尾部空白，不做 trim。拒绝前导空白、点路径段、重复斜杠、NUL、CR、LF 和冒号；不允许重复的相同目标路径。
        cgroupPermissions: { type: string, default: rwm }
    DockerContainerGPUInput:
      type: object
      properties:
        driver:
          type: string
          description: 去除首尾空白；留空由 Docker 自动选择，否则须匹配 ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$。
        count:
          type: integer
          minimum: -1
          maximum: 128
          description: -1 请求全部设备；1–128 请求指定数量；0 或省略仅在提供非空 deviceIds 时有效。
        deviceIds: { type: array, items: { type: string } }
        capabilities:
          type: array
          items: { type: string }
          description: 每项去除首尾空白并转为小写，仅允许字母、数字和下划线，不允许重复（不区分大小写）；省略或空数组由 Docker 映射默认使用 gpu。
    DockerContainerCreateRequest:
      type: object
      required: [image, runContainer]
      properties:
        image: { type: string, minLength: 1, maxLength: 512 }
        name: { type: string, maxLength: 128 }
        cpu: { type: number, exclusiveMinimum: 0, maximum: 256 }
        memoryBytes: { type: integer, minimum: 0 }
        restartPolicy: { type: string, enum: ['no', always, on-failure, unless-stopped], default: 'no' }
        restartMaxRetries: { type: integer, minimum: 0 }
        environment: { type: object, additionalProperties: { type: string } }
        mounts: { type: array, items: { $ref: '#/components/schemas/DockerContainerMountInput' } }
        network: { $ref: '#/components/schemas/DockerContainerNetworkInput' }
        ports: { type: array, items: { $ref: '#/components/schemas/DockerContainerPortInput' } }
        command:
          type: array
          description: Docker argv 参数；每项作为独立参数传递，不由 NCP 拼接。
          minItems: 1
          items: { type: string, minLength: 1 }
        privileged: { type: boolean, default: false }
        capAdd: { type: array, items: { type: string } }
        capDrop: { type: array, items: { type: string } }
        devices: { type: array, items: { $ref: '#/components/schemas/DockerContainerDeviceInput' } }
        gpus: { type: array, items: { $ref: '#/components/schemas/DockerContainerGPUInput' } }
        runContainer: { type: boolean }
    DockerContainerCreateResult:
      type: object
      description: 完整创建确认；客户端还须核对 runContainer 与本次提交意图一致，且 started 与该意图一致。无法核实的成功响应不得作为可重复提交的失败。
      required: [containerId, name, image, state, created, started, runContainer]
      properties:
        containerId: { type: string, minLength: 1, pattern: '\S' }
        name: { type: string }
        image: { type: string, minLength: 1, pattern: '\S' }
        state: { type: string, enum: [running, stopped] }
        created: { type: boolean, const: true }
        started:
          type: boolean
          description: 是否成功调用启动；启动后的进程仍可能退出，因此不等同于当前 state 为 running。
        runContainer:
          type: boolean
          description: 回显本次创建请求的启动意图；成功时与 started 相同。
    DockerProjectDeleteRequest:
      type: object
      required: [projectId, kind, registryName]
      properties:
        projectId: { type: string, minLength: 1 }
        kind: { type: string, enum: [compose] }
        registryName: { type: string, minLength: 1 }
    DockerProjectDeleteContainerResult:
      type: object
      required: [containerId, name, state, deleted, success]
      properties:
        containerId: { type: string }
        name: { type: string }
        state: { type: string }
        deleted: { type: boolean }
        success: { type: boolean }
        errorCode: { type: string }
    DockerProjectDeleteResult:
      type: object
      required: [projectId, kind, completed, partial, registryDeleted, registryRolledBack, containers]
      properties:
        projectId: { type: string }
        kind: { type: string, enum: [compose] }
        completed: { type: boolean }
        partial: { type: boolean }
        registryDeleted: { type: boolean }
        registryRolledBack: { type: boolean }
        containers:
          type: array
          items: { $ref: '#/components/schemas/DockerProjectDeleteContainerResult' }
    StandaloneProjectActionRequest:
      type: object
      required: [containerIds]
      properties:
        projectId: { type: string }
        kind: { type: string, enum: [standalone] }
        containerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        action: { type: string, enum: [start, stop, restart] }
    DockerProjectContainerActionResult:
      type: object
      required: [containerId, name, action, state, success]
      properties:
        containerId: { type: string }
        name: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        state: { type: string }
        success:
          type: boolean
          description: 动作与读回均成功，且本次观察状态符合目标（start/restart 为 running，stop 为 stopped）；不保证之后持续健康。
        errorCode:
          type: string
          description: DOCKER_CONTAINER_STATE_MISMATCH 表示命令已返回但读回状态不符，state 保留实际观察；不表示没有副作用，也不授权自动重试。
    DockerProjectActionResult:
      type: object
      required: [projectId, kind, action, state, completed, containers]
      properties:
        projectId: { type: string }
        kind: { type: string, enum: [standalone] }
        action: { type: string, enum: [start, stop, restart] }
        state: { type: string }
        completed:
          type: boolean
          description: 全部请求容器都有结果且 success 为 true；状态不符或单项失败时为 false，不触发重试、额外轮询或回滚。
        containers:
          type: array
          items: { $ref: '#/components/schemas/DockerProjectContainerActionResult' }
    ComposeLifecycleRequest:
      type: object
      required: [projectId, workingDirectory, configFiles, action]
      properties:
        projectId: { type: string, minLength: 1 }
        workingDirectory: { type: string, minLength: 1 }
        configFiles:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        action: { type: string, enum: [start, stop, restart] }
    ComposeLifecycleServiceStatus:
      type: object
      required: [name, state, running]
      properties:
        name: { type: string }
        containerId: { type: string }
        state: { type: string }
        running: { type: boolean }
    ComposeLifecycleResult:
      type: object
      required: [projectId, action, state, services, output, completed]
      properties:
        projectId: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        state: { type: string }
        services:
          type: array
          items: { $ref: '#/components/schemas/ComposeLifecycleServiceStatus' }
        output: { type: string }
        completed: { type: boolean }
    ComposeReadRequest:
      type: object
      required: [projectId, workingDirectory, configFiles]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        configFiles:
          type: array
          minItems: 1
          items: { type: string }
    ComposeProjectConfig:
      type: object
      required: [projectId, workingDirectory, files, collectedAt]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        files:
          type: array
          items:
            $ref: '#/components/schemas/ComposeFileSnapshot'
        collectedAt: { type: string, format: date-time }
    ComposeFileSnapshot:
      type: object
      required: [path, name, content, contentHash, size]
      properties:
        path: { type: string }
        name: { type: string }
        content: { type: string }
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          minLength: 64
          maxLength: 64
          description: 目标磁盘文件原始 UTF-8 字节的 SHA-256，小写十六进制；与同一响应的 content 字节一致，不做换行或 YAML 归一化。
        size: { type: integer, minimum: 0 }
    ComposeValidateRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, maxLength: 2097152 }
    ComposeValidationResult:
      type: object
      required: [valid, services, normalized]
      properties:
        valid: { type: boolean }
        services:
          type: array
          items: { type: string }
        normalized: { type: string }
    ComposeDraftInput:
      type: object
      required: [projectId, configPath, content]
      properties:
        projectId: { type: string, maxLength: 256 }
        configPath: { type: string, maxLength: 2048 }
        content: { type: string, maxLength: 2097152 }
    ComposeDraft:
      allOf:
        - $ref: '#/components/schemas/ComposeDraftInput'
        - type: object
          required: [contentHash, updatedAt]
          properties:
            contentHash: { type: string }
            updatedAt: { type: string, format: date-time }
    ComposeDeployInput:
      type: object
      required: [projectId, workingDirectory, configFiles, targetPath, content, baseContentHash]
      properties:
        projectId: { type: string }
        workingDirectory: { type: string }
        configFiles:
          type: array
          minItems: 1
          items: { type: string }
        targetPath: { type: string }
        content: { type: string, maxLength: 2097152 }
        baseContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          minLength: 64
          maxLength: 64
          description: 本次编辑会话读取的目标磁盘原始字节 hash；不可用草稿、历史版本或本次提交内容的 hash 替代。
    ComposeRevision:
      type: object
      required: [id, projectId, configPath, content, contentHash, backupPath, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        projectId: { type: string }
        configPath: { type: string }
        content: { type: string }
        contentHash: { type: string }
        backupPath: { type: string }
        createdAt: { type: string, format: date-time }
    DockerImageRemoveResult:
      type: object
      required: [imageId, removed]
      properties:
        imageId: { type: string }
        removed: { type: boolean }
    DockerHubSearchResult:
      type: object
      required: [count, page, pageSize, results]
      properties:
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/DockerHubRepository'
    DockerHubRepository:
      type: object
      required: [name, namespace, description, starCount, pullCount, official, publisher, lastUpdated, repositoryType, statusDescription]
      properties:
        name: { type: string }
        namespace: { type: string }
        description: { type: string }
        starCount: { type: integer, minimum: 0 }
        pullCount: { type: integer, minimum: 0 }
        official: { type: boolean }
        publisher: { type: string }
        lastUpdated: { type: string }
        repositoryType: { type: string }
        statusDescription: { type: string }
    DockerHubTagsResult:
      type: object
      required: [count, page, pageSize, results]
      properties:
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/DockerHubTag'
    DockerHubTag:
      type: object
      required: [name, publishedAt, lastUpdated, fullSize, architectures]
      properties:
        name: { type: string }
        publishedAt:
          type: string
          description: Docker Hub 标签的发布时间或最近更新时间，不代表镜像内部构建时间。
        lastUpdated:
          type: string
          deprecated: true
          description: 兼容旧客户端；请改用 publishedAt。
        fullSize: { type: integer, minimum: 0 }
        architectures:
          type: array
          items: { type: string }
    DockerEngineInfo:
      type: object
      required: [serverVersion, operatingSystem, architecture, containers, containersRunning, containersStopped, images]
      properties:
        serverVersion: { type: string }
        operatingSystem: { type: string }
        architecture: { type: string }
        containers: { type: integer, minimum: 0 }
        containersRunning: { type: integer, minimum: 0 }
        containersStopped: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
    InventoryContainer:
      type: object
      required: [id, name, image, state, status, createdAt, ports, projectId, projectName, serviceName]
      description: 非时间字符串可为空，容器状态保留未知字符串，时间允许 Go 零值；startedAt、finishedAt、exitCode、restartCount、health 为兼容旧响应的可选补充字段。浏览器只校验时间字段的字符串类型，采集时间的新鲜度由状态层判断。
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        createdAt:
          type: string
          format: date-time
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        restartCount: { type: integer, minimum: 0 }
        health: { type: string, enum: [none, starting, healthy, unhealthy] }
        ports:
          type: [array, 'null']
          description: 必须提供；兼容 Go nil slice 的显式 null，浏览器归一化为 []，缺失字段不接受。
          items:
            $ref: '#/components/schemas/PortMapping'
        projectId: { type: string }
        projectName: { type: string }
        serviceName: { type: string }
    PortMapping:
      type: object
      required: [hostIp, privatePort, publicPort, protocol]
      properties:
        hostIp: { type: string }
        privatePort: { type: integer, minimum: 0, maximum: 65535 }
        publicPort: { type: integer, minimum: 0, maximum: 65535 }
        protocol: { type: string }
    DockerProject:
      type: object
      required: [id, name, kind, state, workingDirectory, configFiles, containerCount, runningCount]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [compose, standalone]
        state:
          type: string
          enum: [running, stopped, degraded]
        workingDirectory: { type: string }
        configFiles:
          type: [array, 'null']
          description: 必须提供；兼容 Go nil slice 的显式 null，浏览器归一化为 []，缺失字段不接受。
          items: { type: string }
        containerCount: { type: integer, minimum: 0 }
        runningCount: { type: integer, minimum: 0 }
    ContainerActionResult:
      type: object
      required: [containerId, name, action, state]
      properties:
        containerId: { type: string }
        name: { type: string }
        action:
          type: string
          enum: [start, stop, restart]
        state: { type: string }
    ContainerMountDetails:
      type: object
      required: [type, destination, readOnly]
      properties:
        type: { type: string }
        name: { type: string }
        source: { type: string }
        destination: { type: string }
        driver: { type: string }
        readOnly: { type: boolean }
    ContainerNetworkDetails:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ipAddress: { type: string }
        gateway: { type: string }
        ipv6Address: { type: string }
        macAddress: { type: string }
    ContainerDetails:
      type: object
      description: Safe operational view. Environment, labels, credentials, health output and raw command are intentionally excluded.
      required: [id, name, image, state, healthFailingStreak, exitCode, restartCount, oomKilled, restartMaximumRetries, autoRemove, privileged, readonlyRootfs, nanoCpus, memoryBytes, ports, mounts, networks]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        health: { type: string, enum: [none, starting, healthy, unhealthy] }
        healthFailingStreak: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        restartCount: { type: integer, minimum: 0 }
        oomKilled: { type: boolean }
        platform: { type: string }
        driver: { type: string }
        networkMode: { type: string }
        restartPolicy: { type: string }
        restartMaximumRetries: { type: integer, minimum: 0 }
        autoRemove: { type: boolean }
        privileged: { type: boolean }
        readonlyRootfs: { type: boolean }
        nanoCpus: { type: integer, minimum: 0 }
        memoryBytes: { type: integer, minimum: 0 }
        ports:
          type: array
          items: { $ref: '#/components/schemas/PortMapping' }
        mounts:
          type: array
          items: { $ref: '#/components/schemas/ContainerMountDetails' }
        networks:
          type: array
          items: { $ref: '#/components/schemas/ContainerNetworkDetails' }
    ContainerLogsResult:
      type: object
      required: [containerId, tail, collectedAt, entries]
      properties:
        containerId: { type: string }
        tail: { type: integer, minimum: 1, maximum: 500 }
        collectedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ContainerLogEntry'
    ContainerLogEntry:
      type: object
      required: [timestamp, level, stream, message]
      properties:
        timestamp: { type: string, format: date-time }
        level: { type: string, enum: [error, warning, info, debug] }
        stream:
          type: string
          enum: [stdout, stderr]
        message: { type: string }
        rawMessage:
          type: string
          description: 仅在移除正文前导时间或级别信息时返回的原始日志内容
    ServiceListResponse:
      type: object
      required: [collectedAt, services]
      properties:
        collectedAt:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/DockerProject'
    Capabilities:
      type: object
      required:
        - architecture
        - docker
        - compose
        - systemd
        - journald
        - cgroupVersion
        - procReadable
        - sysReadable
        - smartctl
        - nvmeCli
        - hostTerminal
        - rootFilesystemWritable
      properties:
        hostname:
          type: string
        architecture:
          type: string
          examples: [arm64]
        operatingSystem:
          $ref: '#/components/schemas/OperatingSystem'
        deviceModel:
          type: [string, 'null']
        docker:
          type: boolean
        dockerApiVersion:
          type: [string, 'null']
        compose:
          type: boolean
        composeVersion:
          type: [string, 'null']
        systemd:
          type: boolean
        journald:
          type: boolean
        cgroupVersion:
          type: integer
          minimum: 0
          description: 0 表示未识别，1 与 2 分别表示 cgroup v1、v2。
        procReadable:
          type: boolean
        sysReadable:
          type: boolean
        smartctl:
          type: boolean
        nvmeCli:
          type: boolean
        temperatureSensors:
          type: array
          items:
            type: string
        dataVolumes:
          type: array
          items:
            type: string
        networkInterfaces:
          type: array
          items:
            type: string
        canManageSystemUsers:
          type: boolean
        rootFilesystemWritable:
          type: boolean
        hostTerminal:
          type: boolean
        tailscale:
          $ref: '#/components/schemas/TailscaleCapability'
        mihomo:
          $ref: '#/components/schemas/MihomoCapability'
        dns:
          $ref: '#/components/schemas/DNSCapability'
        publicEgress:
          $ref: '#/components/schemas/PublicEgressCapability'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ProbeWarning'
    CapabilityEvidence:
      type: object
      required: [source, status, detail]
      properties:
        source: { type: string }
        status: { type: string }
        detail: { type: string }
    TailscaleCapability:
      type: object
      required: [detected, state, backendState, version, interface, overlayIps, online, linkState, heartbeatState, reachable, evidence, warnings]
      properties:
        detected: { type: boolean }
        state: { type: string }
        backendState: { type: string }
        version: { type: string }
        interface: { type: string }
        overlayIps: { type: array, items: { type: string } }
        online: { type: boolean }
        linkState: { type: string }
        heartbeatState: { type: string }
        reachable: { type: boolean }
        evidence: { type: array, items: { $ref: '#/components/schemas/CapabilityEvidence' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ProbeWarning' } }
    MihomoControllerCapability:
      type: object
      required: [detected, endpoint, reachable, authRequired, tokenConfigured, operations, detectionSource]
      properties:
        detected: { type: boolean }
        endpoint: { type: string, description: 已脱敏的控制器地址 }
        reachable: { type: boolean }
        authRequired: { type: boolean }
        tokenConfigured: { type: boolean }
        operations: { type: array, items: { type: string } }
        detectionSource: { type: string }
    MihomoCapability:
      type: object
      required: [detected, state, processName, executable, version, controller, evidence, warnings]
      properties:
        detected: { type: boolean }
        state: { type: string }
        processName: { type: string }
        executable: { type: string }
        version: { type: string }
        controller: { $ref: '#/components/schemas/MihomoControllerCapability' }
        evidence: { type: array, items: { $ref: '#/components/schemas/CapabilityEvidence' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ProbeWarning' } }
    MihomoInvokeRequest:
      type: object
      required: [operation]
      properties:
        operation: { type: string, enum: [version, health, traffic, connections, proxies, select-proxy] }
        group: { type: string, maxLength: 128 }
        proxy: { type: string, maxLength: 128 }
    MihomoInvokeResult:
      type: object
      required: [operation, statusCode, data]
      properties:
        operation: { type: string }
        statusCode: { type: integer, minimum: 100, maximum: 599 }
        data: {}
    MihomoInspectionRequest:
      type: object
      properties:
        force: { type: boolean, default: false }
    MihomoLocalProxy:
      type: object
      required: [address, mode]
      properties:
        address: { type: string, description: 本机代理监听地址 }
        mode: { type: string }
    MihomoStrategySelection:
      type: object
      required: [group, selectedNode, nodeType, provider]
      properties:
        group: { type: string }
        selectedNode: { type: string }
        nodeType: { type: string }
        provider: { type: string, description: 本地 provider 名称，不是订阅地址 }
    MihomoNodeInspection:
      type: object
      required: [server, port, resolvedIp, country, region, isp, asn]
      properties:
        server: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
        resolvedIp: { type: string }
        country: { type: string }
        region: { type: string }
        isp: { type: string }
        asn: { type: string }
    MihomoInspection:
      type: object
      required: [status, capability, localProxy, strategy, node, publicEgress, checkedAt, expiresAt, errorCode]
      properties:
        status: { type: string }
        capability: { $ref: '#/components/schemas/MihomoCapability' }
        localProxy: { $ref: '#/components/schemas/MihomoLocalProxy' }
        strategy: { $ref: '#/components/schemas/MihomoStrategySelection' }
        node: { $ref: '#/components/schemas/MihomoNodeInspection' }
        publicEgress: { $ref: '#/components/schemas/PublicEgressResult' }
        checkedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        errorCode: { type: string }
    DNSCapability:
      type: object
      required: [backend, detected, state, readOnly, canRead, canPreview, canConfirm, canRollback, nameservers, configuredNameservers, detectionSource, errorCode]
      properties:
        backend: { type: string, enum: [systemd-resolved, networkmanager, static-resolv-conf, ugos-network-service, unknown] }
        detected: { type: boolean }
        state: { type: string }
        readOnly: { type: boolean }
        canRead: { type: boolean }
        canPreview: { type: boolean }
        canConfirm: { type: boolean }
        canRollback: { type: boolean }
        nameservers: { type: array, items: { type: string } }
        configuredNameservers:
          type: array
          items: { type: string }
          description: DNS servers managed by the detected writable backend; may differ from effective resolvers.
        detectionSource: { type: string }
        errorCode: { type: string }
    DNSChangeRequest:
      type: object
      required: [nameservers]
      properties:
        interface: { type: string, maxLength: 128 }
        connectionId: { type: string, maxLength: 256 }
        nameservers:
          type: array
          minItems: 1
          maxItems: 6
          items:
            oneOf:
              - { type: string, format: ipv4 }
              - { type: string, format: ipv6 }
        searchDomains:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 253 }
    DNSState:
      type: object
      required: [interface, connectionId, nameservers, searchDomains]
      properties:
        interface: { type: string }
        connectionId: { type: string }
        nameservers: { type: array, items: { type: string } }
        searchDomains: { type: array, items: { type: string } }
    DNSChangePreview:
      type: object
      required: [previewId, backend, before, after, requiresConfirm, rollbackAvailable, expiresAt, errorCode]
      properties:
        previewId: { type: string }
        backend: { type: string }
        before: { $ref: '#/components/schemas/DNSState' }
        after: { $ref: '#/components/schemas/DNSState' }
        requiresConfirm: { type: boolean }
        rollbackAvailable: { type: boolean }
        expiresAt: { type: string, format: date-time }
        errorCode: { type: string }
    DNSChangeConfirmation:
      type: object
      required: [previewId, confirmed]
      properties:
        previewId: { type: string, minLength: 1 }
        confirmed: { type: boolean, const: true }
    DNSRollbackRequest:
      type: object
      required: [changeId]
      properties:
        changeId: { type: string, minLength: 1 }
    DNSChangeResult:
      type: object
      required: [changeId, backend, applied, rollbackAvailable, appliedAt, errorCode]
      properties:
        changeId: { type: string }
        backend: { type: string }
        applied: { type: boolean }
        rollbackAvailable: { type: boolean }
        appliedAt: { type: string, format: date-time }
        errorCode: { type: string }
    PublicEgressCapability:
      type: object
      required: [configured, status, endpoint, requiresUserAction, detectionSource, errorCode]
      properties:
        configured: { type: boolean }
        status: { type: string }
        endpoint: { type: string, description: 已脱敏的检测端点 }
        requiresUserAction: { type: boolean }
        detectionSource: { type: string }
        errorCode: { type: string }
    PublicEgressResult:
      type: object
      required: [status, address, checkedAt, detectionSource, errorCode]
      properties:
        status: { type: string }
        address: { type: string }
        country: { type: string }
        region: { type: string }
        isp: { type: string }
        asn: { type: string }
        checkedAt: { type: string, format: date-time }
        detectionSource: { type: string }
        errorCode: { type: string }
    OperatingSystem:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        prettyName:
          type: string
    ProbeWarning:
      type: object
      required: [code]
      properties:
        code:
          type: string
          examples: [PROBE_SOURCE_UNAVAILABLE]
        source:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    LogResponse:
      type: object
      required: [collectedAt, entries, nextCursor]
      properties:
        collectedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        nextCursor: { type: string }
    LogEntry:
      type: object
      required: [id, timestamp, source, unit, level, message]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        source: { type: string, enum: [system, agent, container] }
        unit: { type: string }
        level: { type: string, enum: [error, warning, info, debug] }
        message: { type: string }
        rawMessage: { type: string, description: 未清理级别和时间前缀的原始日志 }
  securitySchemes:
    RootSession:
      type: apiKey
      in: cookie
      name: ncp_session
