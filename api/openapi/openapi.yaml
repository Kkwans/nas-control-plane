  /api/v1/docker/containers/create-jobs:
    post:
      operationId: submitDockerContainerCreateJob
      summary: 持久接收单容器创建任务
      description: >-
        接受与同步创建相同的 DockerContainerCreateRequest，支持仅创建或创建并启动；旧同步 POST /api/v1/docker/containers 仍返回201。
        独立单 worker、容量1；queued、running 与结果待持久化任务均占容量，并共享全局容量32。排队期限10分钟，与执行预算分开；Server执行预算10分钟，Agent创建预算2分钟，失败清理独立预算15秒。
        不支持取消、retry 或重启自动重放；HTTP断开不取消已接收任务，每个任务最多派发一次，保存失败仅重存结果。
        请求配置只保存在内存，不写入数据库、日志、reference 或任务快照；reference 省略或为空。
        completed 仅证明创建及所请求的启动调用得到确认，不保证容器继续运行或健康；createResult 只包含 containerId、created 和 started。
        可能已派发的 RPC 错误（包括 START_FAILED、CLEANUP_FAILED）为 interrupted / artifactState=unknown，不自动重试。
        重启后仍可读取持久化任务详情与成功回执；历史列表摘要不包含 createResult。
      tags: [docker]
      security: [{RootSession: []}]
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。完整请求体最多 16384 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockerContainerCreateRequest'
      responses:
        '202':
          description: 已持久接收，返回原始 queued 快照；type=docker-container-create，reference省略或为空，cancellable=false，artifactState=unknown，progress/downloadedBytes/totalBytes/speedBytes均为0，layers为空对象；无 createResult、completedAt、error、errorCode、cancellationStatus 或 persistenceStatus。queued 接收回执不是执行成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
        '400':
          description: 容器配置无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Root 登录会话缺失或无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: JOB_PERSIST_FAILED、JOB_QUEUE_FULL、JOB_ENGINE_UNAVAILABLE 或 AGENT_DOCKER_CONTROL_UNAVAILABLE（缺少容器创建能力）；未返回持久接收成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
