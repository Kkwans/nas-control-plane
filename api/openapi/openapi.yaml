openapi: 3.1.1
info:
  title: NAS Control Plane API
  version: 0.1.0
  description: Phase 0 的 API 契约。能力信息只能由 ncp-agent 的受控接口提供。
paths:
  /healthz:
    get:
      operationId: getServerHealth
      summary: 获取 NCP Server 健康状态
      tags: [system]
      responses:
        '200':
          description: Server 可响应 HTTP 请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: 获取 NAS 环境能力
      tags: [system]
      responses:
        '200':
          description: 已完成只读探测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          description: Agent 不可用或探测源不可读
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/agent-status:
    get:
      operationId: getAgentStatus
      summary: 获取 Agent Socket 状态
      tags: [system]
      responses:
        '200':
          description: Agent Socket 可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '503':
          description: Agent Socket 不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ws/terminal:
    get:
      operationId: openTerminalPOCWebSocket
      summary: 打开受控 P0 终端 WebSocket
      description: 仅在 `ncp-server serve --terminal-poc` 显式启用；仅支持固定 host 或受标签保护的临时 container 目标，不接受命令、Shell、路径或容器 ID。
      tags: [terminal]
      parameters:
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [host, container]
      responses:
        '101':
          description: WebSocket 已切换协议。二进制帧承载终端输入/输出，文本帧承载 resize、close 与会话状态。
        '400':
          description: 终端目标或握手参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未启用 P0 终端通道
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          examples: [ok]
        service:
          type: string
          examples: [ncp-server]
    AgentStatus:
      type: object
      required: [protocolVersion, agentEUID, transport]
      properties:
        protocolVersion:
          type: string
          examples: [p0-v1]
        agentEUID:
          type: integer
          minimum: 0
        transport:
          type: string
          examples: [unix]
    Capabilities:
      type: object
      required:
        - architecture
        - docker
        - compose
        - systemd
        - journald
        - cgroupVersion
        - procReadable
        - sysReadable
        - smartctl
        - nvmeCli
        - hostTerminal
        - rootFilesystemWritable
      properties:
        hostname:
          type: string
        architecture:
          type: string
          examples: [arm64]
        operatingSystem:
          $ref: '#/components/schemas/OperatingSystem'
        deviceModel:
          type: [string, 'null']
        docker:
          type: boolean
        dockerApiVersion:
          type: [string, 'null']
        compose:
          type: boolean
        composeVersion:
          type: [string, 'null']
        systemd:
          type: boolean
        journald:
          type: boolean
        cgroupVersion:
          type: integer
          minimum: 0
          description: 0 表示未识别，1 与 2 分别表示 cgroup v1、v2。
        procReadable:
          type: boolean
        sysReadable:
          type: boolean
        smartctl:
          type: boolean
        nvmeCli:
          type: boolean
        temperatureSensors:
          type: array
          items:
            type: string
        dataVolumes:
          type: array
          items:
            type: string
        networkInterfaces:
          type: array
          items:
            type: string
        canManageSystemUsers:
          type: boolean
        rootFilesystemWritable:
          type: boolean
        hostTerminal:
          type: boolean
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ProbeWarning'
    OperatingSystem:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        prettyName:
          type: string
    ProbeWarning:
      type: object
      required: [code]
      properties:
        code:
          type: string
          examples: [PROBE_SOURCE_UNAVAILABLE]
        source:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
