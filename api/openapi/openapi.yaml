openapi: 3.1.1
info:
  title: NAS Control Plane API
  version: 0.1.0
  description: Phase 0 的 API 契约。能力信息只能由 ncp-agent 的受控接口提供。
paths:
  /healthz:
    get:
      operationId: getServerHealth
      summary: 获取 NCP Server 健康状态
      tags: [system]
      responses:
        '200':
          description: Server 可响应 HTTP 请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Get Root account initialization and current session status
      tags: [auth]
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '503':
          description: Authentication database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapRootAccount
      summary: Create the first Root account and start a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: Root account created and session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Root account was already initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginRootAccount
      summary: Start a Root session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logoutRootAccount
      summary: End the current Root session
      tags: [auth]
      responses:
        '204':
          description: Session cleared
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 列出全部等权 Root 账号
      tags: [users]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 按用户名排序的账号列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedUser'
    post:
      operationId: createUser
      summary: 创建一个等权 Root 账号
      tags: [users]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: 账号已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userID}/status:
    put:
      operationId: updateUserStatus
      summary: 启用或禁用账号
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '409':
          description: 当前账号或最后可用账号受保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/password-policy:
    get:
      operationId: getPasswordPolicy
      summary: 读取当前密码长度与字符类型规则
      tags: [users]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 当前密码规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
    put:
      operationId: updatePasswordPolicy
      summary: 更新新密码和新账号使用的密码规则
      tags: [users]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      responses:
        '200':
          description: 已保存的密码规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
  /api/v1/users/{userID}/password:
    put:
      operationId: updateUserPassword
      summary: 修改自己的密码或重置其他账号密码
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 1, maxLength: 256 }
      responses:
        '204':
          description: 密码已更新且目标账号全部会话已撤销
        '401':
          description: 当前密码不正确
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userID}:
    delete:
      operationId: deleteUser
      summary: 删除非当前账号
      tags: [users]
      security: [{RootSession: []}]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204':
          description: 账号及其全部会话已删除
        '409':
          description: 当前账号或最后可用账号受保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/preferences:
    get:
      operationId: getUserPreferences
      summary: Get preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Current user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      operationId: updateUserPreferences
      summary: Update preferences for the current Root user
      tags: [settings]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Invalid preference value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/preferences/lists/{listKey}:
    get:
      operationId: getListPreference
      summary: 读取一个资源列表的分页与排序偏好
      tags: [settings]
      security: [{RootSession: []}]
      parameters:
        - { name: listKey, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 列表偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPreference'
    put:
      operationId: updateListPreference
      summary: 保存一个资源列表的分页与排序偏好
      tags: [settings]
      security: [{RootSession: []}]
      parameters:
        - { name: listKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPreference'
      responses:
        '200':
          description: 已保存的列表偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPreference'
  /api/v1/monitoring/samples:
    get:
      operationId: listMetricSamples
      summary: Read persisted host metric samples
      tags: [monitoring]
      security: [{RootSession: []}]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d], default: 6h } }
        - name: from
          in: query
          description: 精确范围起点；必须与 to 成对提供，优先于 range。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 精确范围终点；不得晚于当前时间，最长跨度 7 天。
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Metric samples ordered by collection time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricSample'
  /api/v1/databases/project-preferences:
    get:
      operationId: listDatabaseProjectPreferences
      summary: List persisted database project preferences
      tags: [databases]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Database project preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseProjectPreference'
    put:
      operationId: updateDatabaseProjectPreference
      summary: Persist one database project preference
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseProjectPreference'
      responses:
        '200':
          description: Updated database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseProjectPreference'
        '400':
          description: Invalid database project preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/discovery:
    get:
      operationId: discoverDatabases
      summary: 发现宿主机和项目数据库
      tags: [databases]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 数据库来源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDiscovery'
        '503':
          description: Root Agent 或数据库探测不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/connect:
    post:
      operationId: connectDatabase
      summary: 使用已保存或手动提供的凭据连接数据库
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseConnectRequest'
      responses:
        '200':
          description: 连接诊断结果；不会返回密码、Token 或 DSN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseConnectionDiagnostic'
        '401':
          description: 数据库认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 数据库来源或数据库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 数据库或凭据服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/test-connection:
    post:
      operationId: testDatabaseConnection
      summary: 测试数据库连接并返回稳定诊断码
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseConnection'
      responses:
        '200':
          description: 连接诊断结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseConnectionDiagnostic'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: SQL 或数据约束错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 数据库不可达或 Root Agent 不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/catalog:
    post:
      operationId: getDatabaseCatalog
      summary: 读取数据库表和视图目录
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseConnection'
      responses:
        '200':
          description: 数据库目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCatalog'
        '400':
          description: 数据库请求、SQL 或凭据无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 数据库不可达或凭据服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/query:
    post:
      operationId: queryDatabase
      summary: 执行受控数据库 SQL
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseQueryRequest'
      responses:
        '200':
          description: SQL 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
        '409':
          description: SQL 无效或约束失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/rows:
    post:
      operationId: listDatabaseRows
      summary: 分页读取数据表行
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseRowsRequest'
      responses:
        '200':
          description: 数据表行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseRowsResult'
        '400':
          description: 表名、排序或分页参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/rows/insert:
    post:
      operationId: insertDatabaseRow
      summary: 插入一行数据库记录
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseInsertRequest'
      responses:
        '201':
          description: 插入完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMutationResult'
        '409':
          description: 数据约束失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/rows/update:
    post:
      operationId: updateDatabaseRow
      summary: 更新数据库记录
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdateRequest'
      responses:
        '200':
          description: 更新完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMutationResult'
        '409':
          description: 数据约束失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/databases/rows/delete:
    post:
      operationId: deleteDatabaseRow
      summary: 删除数据库记录
      tags: [databases]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseDeleteRequest'
      responses:
        '200':
          description: 删除完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMutationResult'
        '409':
          description: 数据约束失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: 获取 NAS 环境能力
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 已完成只读探测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          description: Agent 不可用或探测源不可读
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/agent-status:
    get:
      operationId: getAgentStatus
      summary: 获取 Agent Socket 状态
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Agent Socket 可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '503':
          description: Agent Socket 不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/summary:
    get:
      operationId: getSystemSummary
      summary: Get a live NAS host summary
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Live host metrics collected by Root Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSummary'
        '503':
          description: Root Agent or a required metric source is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/details:
    get:
      operationId: getSystemDetails
      summary: 获取设备、硬件、网络、存储、代理和控制链路详情
      description: 由 Root Agent 低频采集；无法获取的能力通过 warnings 和不可用字段明确表达。
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: NAS 静态系统详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDetails'
        '503':
          description: Root Agent 或系统详情采集暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/dns/capability:
    get:
      operationId: getDNSCapability
      summary: 获取 DNS 读取和安全修改能力
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: DNS 能力矩阵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSCapability'
        '503':
          description: DNS 能力不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/dns/preview:
    post:
      operationId: previewDNSChange
      summary: 预览 DNS 修改，不立即写入系统
      tags: [system]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSChangeRequest'
      responses:
        '200':
          description: DNS 修改预览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSChangePreview'
        '409':
          description: 当前 DNS 后端只读或无法预览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/dns/confirm:
    post:
      operationId: confirmDNSChange
      summary: 确认并应用 DNS 修改
      tags: [system]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSChangeConfirmation'
      responses:
        '200':
          description: DNS 修改结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSChangeResult'
        '409':
          description: 确认失败或预览已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/dns/rollback:
    post:
      operationId: rollbackDNSChange
      summary: 回滚已应用的 DNS 修改
      tags: [system]
      security: [{RootSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSRollbackRequest'
      responses:
        '200':
          description: DNS 回滚结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSChangeResult'
        '409':
          description: 回滚失败或变更已不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/public-egress/capability:
    get:
      operationId: getPublicEgressCapability
      summary: 获取公网出口检测能力
      description: 只读取部署配置，不会自动访问外部检测端点。
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 公网出口检测能力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEgressCapability'
  /api/v1/system/public-egress/detect:
    post:
      operationId: detectPublicEgress
      summary: 用户显式触发公网出口检测
      tags: [system]
      security: [{RootSession: []}]
      responses:
        '200':
          description: 公网出口地址及可选地区信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEgressResult'
        '503':
          description: 检测端点未配置、不可达或返回无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEgressResult'
  /api/v1/proxy/mihomo/capability:
    get:
      operationId: getMihomoCapability
      summary: 获取 Mihomo 控制器能力
      tags: [proxy]
      security: [{RootSession: []}]
      responses:
        '200':
          description: Mihomo 进程和 allowlist 能力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MihomoCapability'
  /api/v1/proxy/mihomo/invoke:
    post:
      operationId: invokeMihomo
      summary: 调用受 allowlist 保护的 Mihomo 操作
      tags: [proxy]
