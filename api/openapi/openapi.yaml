  /api/v1/docker/projects/standalone/action-jobs/{action}:
    post:
      operationId: submitDockerProjectActionJob
      summary: 持久接收独立容器项目生命周期任务
      description: >-
        正文仅接受 containerIds，1 至 128 个不重复的完整小写容器 ID，拒绝未知和重复 JSON 字段，正文上限16KiB。
        冻结所选子集，running 持久确认后以独立5秒预算读取 inventory，确认每个目标唯一属于 standalone；
        预检失败以 DOCKER_PROJECT_ACTION_PREFLIGHT_FAILED 结束且零派发。不按状态重选或补目标，预检不保证原子归属。
        此后三种类型 docker-project-start/stop/restart 只调用一次既有 ControlStandaloneProject，沿用45秒预算；
        不保证大型批次完成，不更改 Agent worker。与镜像删除、单容器操作共享单 worker 队列，总容量32、排队期限10分钟，
        不提供跨旧同步入口互斥。HTTP断开不取消任务，不支持 cancel/retry 或重启自动重放；保存失败仅重存结果。
        全回执身份、完整集合、每项动作和汇总一致才可保存最小 projectActionResult。
        全部成功为 completed；明确反态为 failed/DOCKER_PROJECT_STATE_MISMATCH，操作已发生；
        任一执行结果未知则 interrupted，可信完整回执可保留其他安全确认项。超时、传输失败或无效回执 interrupted 且无结果项。
        结果仅证明本次调用及读回，不保证持续状态或健康。旧同步和 Compose 入口保持。
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, restart] }
      requestBody:
        description: 必须使用单一 application/json Content-Type，允许有效 MIME 参数；不接受缺失、重复或其他媒体类型。完整请求体最多 16384 字节（bytes），包含 JSON 前后空白、所有 JSON 值及其他尾部字节；按字节而非字符计数，恰好等于上限允许，超过上限返回 413。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [containerIds]
              properties:
                containerIds:
                  type: array
                  minItems: 1
                  maxItems: 128
                  uniqueItems: true
                  items: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
      responses:
        '202':
          description: 已持久接收的原始 queued 快照；type=docker-project-start/stop/restart，reference=standalone，cancellable=false，artifactState=unknown，progress/downloadedBytes/totalBytes/speedBytes均为0，layers为空；无 projectActionResult、completedAt、error、errorCode、cancellationStatus 或 persistenceStatus。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSnapshot' }
        '400':
          description: DOCKER_PROJECT_ACTION_INVALID，参数不符合严格合同
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Root 登录会话缺失或无效
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: JOB_PERSIST_FAILED、JOB_QUEUE_FULL、JOB_ENGINE_UNAVAILABLE 或 AGENT_DOCKER_CONTROL_UNAVAILABLE
  /api/v1/docker/containers/{containerID}/action-jobs/{action}:
    post:
      operationId: submitDockerContainerActionJob
      summary: 持久接收单容器启动、停止或重启任务
      description: >-
        仅接受完整小写容器 ID 和精确小写动作，不接受请求体；旧同步 actions 路由保留。
        三种类型 docker-container-start、docker-container-stop、docker-container-restart 与镜像删除共享单 worker 队列，
        并非全局互斥；总容量32，排队期限10分钟。任务不支持取消、retry 或重启自动重放。
        运行预算45秒，HTTP断开不取消已接收任务。每个任务最多派发一次，保存失败仅重存结果。
        completed 仅证明本次调用返回且读回 running（start/restart）或 stopped（stop），不保证持续状态或健康。
        合法归属但明确反态为 failed / DOCKER_CONTAINER_STATE_MISMATCH，表示命令已返回但读回未达目标，不表示未执行。
        回执缺失、归属不符或状态未知为 interrupted / DOCKER_CONTAINER_ACTION_RECEIPT_INVALID。
        超时为 interrupted / JOB_EXECUTION_TIMEOUT；可能已派发的错误（包括 NOT_FOUND、ACTION_FAILED、INSPECT_FAILED）保守视为未知，
        不自动重试。只有固定白名单确证派发前拒绝可 failed。
      tags: [docker]
      security: [{RootSession: []}]
      parameters:
        - name: containerID
          in: path
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[a-f0-9]{64}$'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, restart]
      responses:
        '202':
          description: 已持久接收，返回原始 queued 快照；type 为 docker-container-start/stop/restart，reference 为完整容器 ID，cancellable=false，artifactState=unknown，progress/downloadedBytes/totalBytes/speedBytes 均为0，layers为空对象；无 completedAt、error、errorCode、cancellationStatus 或 persistenceStatus。queued 接收回执不是执行成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSnapshot'
        '400':
          description: DOCKER_CONTAINER_ACTION_INVALID，容器 ID、动作或非空正文不符合严格合同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Root 登录会话缺失或无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '503':
          description: JOB_PERSIST_FAILED、JOB_QUEUE_FULL 或 JOB_ENGINE_UNAVAILABLE；未返回持久接收成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/docker/containers/{containerID}/actions/{action}:
