  /api/v1/databases/query:
    post:
      operationId: queryDatabase
      summary: 执行 Root 数据库 SQL
      description: >-
        结果模式只决定读取返回行还是驱动影响行数，不限制 SQL 写入权限。
        NCP 对单次请求仅选择一次 Query 或 Exec 调用，不因错误、不支持模式或未知影响行数自动切换路径或重放；不承诺数据库驱动或网络层的 exactly-once。
        行结果最多展示 500 行，并采用 1 MiB（1048576 字节）的保守结果保留预算；预算包含转义字符串、base64、列名及容器等结构开销，可能在实际编码大小达到上限前截断。
        只保留预算内的完整行前缀，不裁剪单元文本；首行超预算时可返回 columns 和空 rows，并标记 truncated=true、truncationReason=byte_limit，不能解读为零匹配或零写入。
        行数与字节预算都不限制数据库写入范围；返回行也不代表只读。元数据本身过大或最终 JSON/protobuf 响应超过 1 MiB 时返回 HTTP 422 result_too_large。
        SQL 失败、超时、截断或结果超预算不保证未执行或已回滚，应先核对实际状态再决定是否重试。
        当前响应仅表示驱动暴露的一个结果集，多语句的执行、结果与原子性取决于驱动和数据库。
