syntax = "proto3";

package ncp.agent.v1;

option go_package = "github.com/Kkwans/nas-control-plane/api/gen/go/ncp/agent/v1;agentv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// P0-03 使用受限 Unix Socket 通道向非 root Server 提供白名单只读能力。
service AgentProbeService {
  // 返回协议与 Agent 进程状态。
  rpc GetStatus(google.protobuf.Empty) returns (google.protobuf.Struct);

  // 返回只读环境能力；不包含任意命令执行或 Docker Socket 访问权。
  rpc GetCapabilities(google.protobuf.Empty) returns (google.protobuf.Struct);
}
