server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Phase 0 仅部署静态控制台预览；受控宿主机 API 仍由后续 Agent 部署提供。
    location /api/ {
        default_type application/json;
        return 503 '{"code":"NCP_PHASE_0_API_PENDING","message":"NCP Phase 0 API 尚未部署。","requestId":"ncp-phase-0-console"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
